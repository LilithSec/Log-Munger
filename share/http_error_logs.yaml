        # apache's syslog form is the second rule's, gated on the program
        - '[authz_core:error] [pid 22034] [client 192.0.2.1:58585] AH01630: client denied by server configuration: /home/www/'
  # apache "ErrorLog syslog": the same lines with syslog's stamp in place of
  # apache's own, so the body starts at the module/level block. Gated, since
  # "[error] ..." alone is too loose to take from any program. A second
  # instance logs as httpd/<name> or apache2-<name>.
  - name: http_error_syslog
    gate:
      - field: PROGRAM
        values:
          - '//^(?:httpd|apache2?)(?:[-\/][\w.-]+)?$//'
    field: MESSAGE
    anchored: true
    geoip:
      - http_error_client_ip
      - http_error_remote_ip
    patterns:
      - HTTP_ERROR_APACHE24_BODY
      - HTTP_ERROR_APACHE22_BODY
    tests:
      positive:
        - string: '[authz_core:error] [pid 22034] [client 192.0.2.1:58585] AH01630: client denied by server configuration: /home/www/'
          program: 'httpd'
          result:
            http_error_module: 'authz_core'
            http_error_loglevel: 'error'
            http_error_pid: '22034'
            http_error_client_ip: '192.0.2.1'
            http_error_client_port: '58585'
            http_error_code: 'AH01630'
            http_error_message: 'client denied by server configuration: /home/www/'
        - string: '[:error] [pid 18154:tid 140680873617152] [client 192.0.2.3:48154] AH01630: client denied by server configuration: /x'
          program: 'apache2'
          result:
            http_error_loglevel: 'error'
            http_error_pid: '18154'
            http_error_tid: '140680873617152'
            http_error_client_ip: '192.0.2.3'
            http_error_client_port: '48154'
            http_error_code: 'AH01630'
            http_error_message: 'client denied by server configuration: /x'
        # a second apache instance
        - string: '[authz_core:error] [pid 22036] [client 192.0.2.2:59392] AH01630: client denied by server configuration: /home/backend1/'
          program: 'httpd/backend1'
          result:
            http_error_module: 'authz_core'
            http_error_loglevel: 'error'
            http_error_pid: '22036'
            http_error_client_ip: '192.0.2.2'
            http_error_client_port: '59392'
            http_error_code: 'AH01630'
            http_error_message: 'client denied by server configuration: /home/backend1/'
        - string: '[error] [client 127.0.0.1] user wrongusername not found: /basic/file'
          program: 'httpd'
          enriched:
            http_error_client_ip: '127.0.0.1'
            http_error_loglevel: 'error'
            http_error_message: 'user wrongusername not found: /basic/file'
            http_error_user: 'wrongusername'
          result:
            http_error_loglevel: 'error'
            http_error_client_ip: '127.0.0.1'
            http_error_message: 'user wrongusername not found: /basic/file'
      negative:
        - string: '[error] [client 127.0.0.1] user wrongusername not found: /basic/file'
          program: 'sshd'
convert:
  http_error_line: int
# The account an authentication failure names, out of the message. A message
# that names none is left as it is.
decompose:
  - field: http_error_message
    type: pattern
    pattern: HTTP_ERROR_USER
    tests:
      - input: 'user neti not found: /admin'
        result:
          http_error_message: 'user neti not found: /admin'
          http_error_user: 'neti'
      - input: 'user  not found: /'
        result:
          http_error_message: 'user  not found: /'
          http_error_user: ''
      - input: 'user neti: authentication failure for "/": Password Mismatch'
        result:
          http_error_message: 'user neti: authentication failure for "/": Password Mismatch'
          http_error_user: 'neti'
      - input: 'Digest: user `neti'' in realm `private'' not found: /'
        result:
          http_error_message: 'Digest: user `neti'' in realm `private'' not found: /'
          http_error_user: 'neti'
      - input: 'Authorization of user neti to access /private failed, reason: user is not part of the ''require''ed group(s).'
        result:
          http_error_message: 'Authorization of user neti to access /private failed, reason: user is not part of the ''require''ed group(s).'
          http_error_user: 'neti'
      - input: 'user "scriben dio" was not found in "/etc/nginx/.htpasswd"'
        result:
          http_error_message: 'user "scriben dio" was not found in "/etc/nginx/.htpasswd"'
          http_error_user: 'scriben dio'
      - input: 'PAM: user ''neti'' - not authenticated: Authentication failure'
        result:
          http_error_message: 'PAM: user ''neti'' - not authenticated: Authentication failure'
          http_error_user: 'neti'
      - input: 'password doesn''t match for /gitweb/ username: francois'
        result:
          http_error_message: 'password doesn''t match for /gitweb/ username: francois'
          http_error_user: 'francois'
