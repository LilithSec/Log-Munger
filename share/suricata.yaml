---
# Suricata IDS/IPS log enrichment, for both output formats.
#
# eve.json carries the most. Every event is a JSON object, so the rule captures
# the object and hands it to a `type: json` decompose that flattens it into
# suricata_ prefixed keys. An alert's nested alert.{...} object flattens
# generically to suricata_alert_signature, suricata_alert_severity and the
# rest, so an event_type Suricata grows later needs no work here.
#
# That rule is gateless, because eve.json is normally tailed straight off disk
# and a raw line carries no PROGRAM. To keep a gateless "looks like JSON"
# pattern from claiming other daemons' structured output, the
# pattern requires an "event_type" key -- the one field every eve record has
# and nothing else does.
#
# fast.log is the older single-line alert format, which is also what Suricata
# writes when told to log to syslog. That gets a second rule, gated on
# PROGRAM, since its shape is much less distinctive.
includes:
- base
vars_templated:
  # A whole eve.json record. The "event_type" key is what makes this an eve
  # record rather than any other JSON a host might be logging, and requiring it
  # is what makes a gateless rule safe here.
  SURICATA_EVE: '(?<suricata_json>\{.*"event_type"\s*:\s*".*\})'
  # fast.log:
  #   [1:2001219:20] ET SCAN Potential SSH Scan [**] [Classification:
  #   Attempted Information Leak] [Priority: 2] {TCP} 203.0.113.7:44444 ->
  #   192.0.2.1:22
  #
  # The signature id is the stable key: signature text gets reworded between
  # ruleset releases but 2001219 stays 2001219.
  SURICATA_FAST: '\[(?<suricata_alert_gid>[% INT %]):(?<suricata_alert_signature_id>[% INT %]):(?<suricata_alert_rev>[% INT %])\] (?<suricata_alert_signature>.*?) \[\*\*\] \[Classification: (?<suricata_alert_category>[^\]]*)\] \[Priority: (?<suricata_alert_severity>[% INT %])\] \{(?<suricata_proto>[^}]*)\} (?<suricata_src_ip>[% IP %]):(?<suricata_src_port>[% INT %]) -> (?<suricata_dest_ip>[% IP %]):(?<suricata_dest_port>[% INT %])'
  # Anything else Suricata said: startup, rule loading, engine warnings.
  SURICATA_MESSAGE: '(?:\[(?<suricata_level>[A-Za-z]+)\] )?(?<suricata_message>.+)'
vars_tests:
  SURICATA_EVE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '{"timestamp":"2026-07-15T10:00:00.123456+0000","event_type":"alert","src_ip":"203.0.113.7","src_port":44444,"dest_ip":"192.0.2.1","dest_port":22,"proto":"TCP","alert":{"signature_id":2001219,"signature":"ET SCAN Potential SSH Scan","severity":2}}'
        result: '{"timestamp":"2026-07-15T10:00:00.123456+0000","event_type":"alert","src_ip":"203.0.113.7","src_port":44444,"dest_ip":"192.0.2.1","dest_port":22,"proto":"TCP","alert":{"signature_id":2001219,"signature":"ET SCAN Potential SSH Scan","severity":2}}'
    negative:
      # JSON, but not eve: no event_type, so this is somebody else's log
      - '{"t":{"$date":"2026-07-27T02:49:30.131+00:00"},"s":"I","c":"NETWORK","msg":"Connection accepted"}'
      - 'not json at all'
  SURICATA_FAST:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '[1:2001219:20] ET SCAN Potential SSH Scan [**] [Classification: Attempted Information Leak] [Priority: 2] {TCP} 203.0.113.7:44444 -> 192.0.2.1:22'
        result: '[1:2001219:20] ET SCAN Potential SSH Scan [**] [Classification: Attempted Information Leak] [Priority: 2] {TCP} 203.0.113.7:44444 -> 192.0.2.1:22'
    negative:
      - 'This is Suricata version 7.0.2 RELEASE running in SYSTEM mode'
  SURICATA_MESSAGE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'This is Suricata version 7.0.2 RELEASE running in SYSTEM mode'
        result: 'This is Suricata version 7.0.2 RELEASE running in SYSTEM mode'
      - string: '[ERRCODE: SC_ERR_NO_RULES(42)] - No rules loaded'
        result: '[ERRCODE: SC_ERR_NO_RULES(42)] - No rules loaded'
    negative:
      - ''
# The flattened eve record and the fast.log pattern use the same field names,
# so one geoip list serves both.
geoip:
  - suricata_src_ip
  - suricata_dest_ip
convert:
  suricata_src_port: int
  suricata_dest_port: int
  suricata_alert_gid: int
  suricata_alert_signature_id: int
  suricata_alert_rev: int
  suricata_alert_severity: int
# JSON-decode the eve record and flatten it into suricata_* keys. Booleans
# normalize to 1/0 and nulls are skipped, so an event with optional fields
# absent simply produces fewer keys rather than a mess.
decompose:
  - field: suricata_json
    type: json
    prefix: 'suricata_'
    remove: true
    tests:
      - input: '{"timestamp":"2026-07-15T10:00:00.123456+0000","event_type":"alert","src_ip":"203.0.113.7","src_port":44444,"dest_ip":"192.0.2.1","dest_port":22,"proto":"TCP","alert":{"action":"allowed","gid":1,"signature_id":2001219,"rev":20,"signature":"ET SCAN Potential SSH Scan","category":"Attempted Information Leak","severity":2}}'
        result:
          suricata_timestamp: '2026-07-15T10:00:00.123456+0000'
          suricata_event_type: 'alert'
          suricata_src_ip: '203.0.113.7'
          suricata_src_port: 44444
          suricata_dest_ip: '192.0.2.1'
          suricata_dest_port: 22
          suricata_proto: 'TCP'
          suricata_alert_action: 'allowed'
          suricata_alert_gid: 1
          suricata_alert_signature_id: 2001219
          suricata_alert_rev: 20
          suricata_alert_signature: 'ET SCAN Potential SSH Scan'
          suricata_alert_category: 'Attempted Information Leak'
          suricata_alert_severity: 2
rules:
  # eve.json. Gateless so a tailed file works with process_item(item => $line),
  # and safe to be gateless because the pattern demands an event_type key.
  - name: suricata_eve
    field: MESSAGE
    anchored: true
    patterns:
      - SURICATA_EVE
    tests:
      positive:
        - string: '{"timestamp":"2026-07-15T10:00:00.123456+0000","event_type":"alert","src_ip":"203.0.113.7","src_port":44444,"dest_ip":"192.0.2.1","dest_port":22,"proto":"TCP","alert":{"signature_id":2001219,"signature":"ET SCAN Potential SSH Scan","severity":2}}'
          enriched:
            suricata_alert_severity: '2'
            suricata_alert_signature: 'ET SCAN Potential SSH Scan'
            suricata_alert_signature_id: '2001219'
            suricata_dest_ip: '192.0.2.1'
            suricata_dest_port: '22'
            suricata_event_type: 'alert'
            suricata_proto: 'TCP'
            suricata_src_ip: '203.0.113.7'
            suricata_src_port: '44444'
            suricata_timestamp: '2026-07-15T10:00:00.123456+0000'
          numeric:
            - suricata_alert_severity
            - suricata_alert_signature_id
            - suricata_dest_port
            - suricata_src_port
          result:
            suricata_json: '{"timestamp":"2026-07-15T10:00:00.123456+0000","event_type":"alert","src_ip":"203.0.113.7","src_port":44444,"dest_ip":"192.0.2.1","dest_port":22,"proto":"TCP","alert":{"signature_id":2001219,"signature":"ET SCAN Potential SSH Scan","severity":2}}'
      negative:
        - 'not json at all'
        # another daemon's JSON must not be claimed: this rule is gateless
        - '{"t":{"$date":"2026-07-27T02:49:30.131+00:00"},"s":"I","c":"NETWORK","msg":"Connection accepted"}'
  # fast.log and everything else Suricata says. Gated, because a bracketed
  # alert line is not distinctive enough to be let loose on every record.
  - name: suricata
    gate:
      - field: PROGRAM
        values:
          - '//^suricata$//'
    field: MESSAGE
    anchored: true
    patterns:
      - SURICATA_FAST
      - SURICATA_MESSAGE
    tests:
      positive:
        - string: '[1:2001219:20] ET SCAN Potential SSH Scan [**] [Classification: Attempted Information Leak] [Priority: 2] {TCP} 203.0.113.7:44444 -> 192.0.2.1:22'
          numeric:
            - suricata_alert_gid
            - suricata_alert_rev
            - suricata_alert_severity
            - suricata_alert_signature_id
            - suricata_dest_port
            - suricata_src_port
          program: 'suricata'
          result:
            suricata_alert_gid: '1'
            suricata_alert_signature_id: '2001219'
            suricata_alert_rev: '20'
            suricata_alert_signature: 'ET SCAN Potential SSH Scan'
            suricata_alert_category: 'Attempted Information Leak'
            suricata_alert_severity: '2'
            suricata_proto: 'TCP'
            suricata_src_ip: '203.0.113.7'
            suricata_src_port: '44444'
            suricata_dest_ip: '192.0.2.1'
            suricata_dest_port: '22'
        - string: 'This is Suricata version 7.0.2 RELEASE running in SYSTEM mode'
          result:
            suricata_message: 'This is Suricata version 7.0.2 RELEASE running in SYSTEM mode'
      negative:
        - ''
        - string: '[1:2001219:20] ET SCAN Potential SSH Scan [**] [Classification: Attempted Information Leak] [Priority: 2] {TCP} 203.0.113.7:44444 -> 192.0.2.1:22'
          program: 'suricata-extra'
