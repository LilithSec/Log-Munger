---
# Kernel ring-buffer (dmesg via syslog) host-health / security enrichment for
# BOTH Linux and FreeBSD.
#
# Gates on the syslog PROGRAM field being "kernel". Patterns are anchored (each
# must match the whole MESSAGE) and first-match wins. Every capture is
# namespaced with kernel_ .
#
# NAMING CONVENTION so every var (and its tests) declares its target kernel:
#   KERNEL_LINUX_*  -> Linux-only message types (OOM, EXT4/XFS, blk I/O, ...)
#   KERNEL_FBSD_*   -> FreeBSD-only message types (signal-exit, GEOM/ZFS, ...)
# The vars_tests and the rule-level positive tests are grouped under matching
# "Linux" / "FreeBSD" headers in the same order.
#
# NOTE: netfilter/iptables/ufw firewall lines ("[UFW BLOCK] IN=eth0 SRC=...")
# ALSO arrive with PROGRAM=kernel and are handled by share/netfilter.yaml. This
# file deliberately does NOT match those; the negative tests assert a "[UFW
# BLOCK] IN=... SRC=..." line matches none of the patterns here so the two files
# do not collide.
includes:
- base
vars_templated:
  # ==================================================================
  # The printk uptime, shared by every Linux pattern below.
  # ==================================================================
  # rsyslog's kernel reader leaves the ring-buffer uptime at the head of the
  # message: "[ 1234.567890] audit: type=1400 ...". Whether it is there is a
  # property of the READER, not of the message -- rsyslog's imklog keeps it,
  # journald's kmsg reader strips it -- and since either may have written the
  # file being tailed, both shapes have to match. Anchored patterns that did
  # not lead with this matched only the stripped shape, and on a stock Debian
  # or Ubuntu the stripped shape is the rarer of the two.
  #
  # The fragment carries its own "?" and its own trailing space, so a pattern
  # needs only to lead with it. Every KERNEL_LINUX_* pattern does.
  #
  # It is deliberately NOT captured. The value is the monotonic boot clock,
  # which the syslog timestamp already covers for ordering, so capturing it
  # would hang a field off every enriched kernel line to no end. A kernel
  # built without CONFIG_PRINTK_TIME emits no prefix at all, which is the
  # same case as a reader that stripped it.
  #
  # The FreeBSD patterns further down do NOT carry it: FreeBSD's syslogd
  # writes kernel messages with no such prefix.
  KERNEL_PRINTK: '(?:\[ *[% INT %]\.[% INT %]\] +)?'
  # ==================================================================
  # Linux kernel messages (KERNEL_LINUX_*).
  # ==================================================================
  # OOM killer (newer format): "Out of memory: Killed process 1234 (mysqld)
  # total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB, UID:999
  # pgtables:1kB oom_score_adj:0"
  KERNEL_LINUX_OOM: '[% KERNEL_PRINTK %]Out of memory: Killed process (?<kernel_oom_pid>[% INT %]) \((?<kernel_oom_process>[% NOTSPACE %])\)(?: total-vm:(?<kernel_oom_total_vm>[^, ]+))?(?:, anon-rss:(?<kernel_oom_anon_rss>[^, ]+))?(?:,? [% GREEDYDATA %])?'
  # OOM killer (older format, no "Out of memory:" prefix): "Killed process 1234
  # (mysqld) total-vm:100kB, anon-rss:50kB, ..."
  KERNEL_LINUX_OOM_OLD: '[% KERNEL_PRINTK %]Killed process (?<kernel_oom_pid>[% INT %]) \((?<kernel_oom_process>[% NOTSPACE %])\)(?: total-vm:(?<kernel_oom_total_vm>[^, ]+))?(?:, anon-rss:(?<kernel_oom_anon_rss>[^, ]+))?(?:,? [% GREEDYDATA %])?'
  # A bridge port changing STP state:
  #   br-lan: port 10(phy0-ap2) entered disabled state
  #   br0: port 2(veth1a2b3c) entered forwarding state
  # Logged on every wifi client roam on an access point and on every container
  # or VM interface coming and going, so on anything running a bridge it is one
  # of the higher-volume kernel messages there is.
  KERNEL_LINUX_BRIDGE_PORT: '[% KERNEL_PRINTK %](?<kernel_bridge>[^\s:]+): port (?<kernel_bridge_port>[% INT %])\((?<kernel_iface>[^)]+)\) entered (?<kernel_bridge_state>[% NOTSPACE %]) state'
  # An interface entering or leaving promiscuous / allmulticast mode:
  #   mwlwifi 0000:01:00.0 phy0-ap2: entered promiscuous mode
  #   mwlwifi 0000:01:00.0 phy0-ap2 (unregistering): left allmulticast mode
  #   eth0: entered promiscuous mode
  # The driver and bus id in front are what netdev_info() adds when the message
  # comes from a driver-bound device; a message about a software device has
  # neither, so both are optional. "(unregistering)" is the kernel noting the
  # device was on its way out, and adds nothing worth a field.
  KERNEL_LINUX_NETDEV_MODE: '[% KERNEL_PRINTK %](?:(?<kernel_driver>[^\s:]+) (?<kernel_bus_id>[% NOTSPACE %]) )?(?<kernel_iface>[^\s:]+)(?: \(unregistering\))?: (?<kernel_netdev_action>entered|left) (?<kernel_netdev_mode>promiscuous|allmulticast) mode'
  # A physical link coming up or going down, as phylib reports it:
  #   mv88e6085 f1072004.mdio-mii:00 lan2: Link is Down
  #   igb 0000:04:00.0 eth0: Link is Up - 1Gbps/Full - flow control rx/tx
  # The speed/duplex and flow-control clauses are only on the "Up" form. This
  # is the message that says a cable was pulled or a switch port flapped, and
  # it is the same on every driver that uses phylib -- which is most of them.
  KERNEL_LINUX_LINK: '[% KERNEL_PRINTK %](?:(?<kernel_driver>[^\s:]+) (?<kernel_bus_id>[% NOTSPACE %]) )?(?<kernel_iface>[^\s:]+): Link is (?<kernel_link_state>Up|Down)(?: - (?<kernel_link_speed>[^/]+)/(?<kernel_link_duplex>[% NOTSPACE %]))?(?: - flow control (?<kernel_link_flow_control>[% GREEDYDATA %]))?'
  # segfault: "php[12345]: segfault at 0 ip 00007f00 sp 00007ffe error 4 in
  # libc-2.31.so[7f00+1c000]"
  KERNEL_LINUX_SEGV: '[% KERNEL_PRINTK %](?<kernel_segv_comm>[% NOTSPACE %])\[(?<kernel_segv_pid>[% INT %])\]: segfault at (?<kernel_segv_addr>[% NOTSPACE %]) ip (?<kernel_segv_ip>[% NOTSPACE %]) sp (?<kernel_segv_sp>[% NOTSPACE %]) error (?<kernel_segv_error>[% INT %])(?: in [% GREEDYDATA %])?'
  # general protection / traps: "traps: nginx[1234] general protection ip:...
  # sp:... error:0 in ..."
  KERNEL_LINUX_TRAP: '[% KERNEL_PRINTK %]traps: (?<kernel_trap_comm>[% NOTSPACE %])\[(?<kernel_trap_pid>[% INT %])\] (?<kernel_trap_detail>[% GREEDYDATA %])'
  # ext4/ext3/ext2 filesystem error: "EXT4-fs error (device sda1):
  # ext4_find_entry:1234: inode #2: comm ls: reading directory lblock 0"
  KERNEL_LINUX_EXT_FS: '[% KERNEL_PRINTK %](?<kernel_fs>EXT[234]-fs) error \(device (?<kernel_device>[% NOTSPACE %])\): (?<kernel_fs_detail>[% GREEDYDATA %])'
  # XFS filesystem error: "XFS (sda1): ..."
  KERNEL_LINUX_XFS: '[% KERNEL_PRINTK %](?<kernel_fs>XFS) \((?<kernel_device>[% NOTSPACE %])\): (?<kernel_fs_detail>[% GREEDYDATA %])'
  # block I/O error: "blk_update_request: I/O error, dev sda, sector 12345678 op
  # 0x0:(READ) flags 0x0 phys_seg 1 prio class 0"
  KERNEL_LINUX_BLK_IO: '[% KERNEL_PRINTK %]blk_update_request: I/O error, dev (?<kernel_io_dev>[% NOTSPACE %]), sector (?<kernel_io_sector>[% INT %])(?: [% GREEDYDATA %])?'
  # AppArmor denial: "audit: type=1400 audit(...): apparmor=\"DENIED\"
  # operation=\"open\" profile=\"/usr/bin/foo\" name=\"/etc/shadow\" pid=1234
  # comm=\"foo\" requested_mask=\"r\" denied_mask=\"r\" fsuid=0 ouid=0". The
  # apparmor mode ("DENIED"/"ALLOWED") is captured directly as
  # kernel_apparmor_mode; the remaining quoted k=v tail is captured as
  # kernel_apparmor_kv and quote-aware kv-decomposed into kernel_apparmor_*
  # fields (operation/profile/name/comm/...).
  #
  # This is the same event share/auditd.yaml handles, arriving by the other
  # route: straight off the kernel ring buffer when auditd is not running (or
  # not the only consumer), so it is prefixed "audit: type=<n>" instead of
  # "type=<name>". Three things it must NOT assume:
  #
  #   - that the tail starts with operation=. Profile-load failures and
  #     disconnected-path denials put info= first and have no operation= at all:
  #       apparmor="STATUS" info="failed to unpack profile" error=-71 profile=...
  #     Requiring operation= dropped those records on the floor entirely.
  #   - that the numeric type is 1400. AppArmor also emits the 1500-range
  #     APPARMOR_* types; the apparmor=" token is the real discriminator, so the
  #     type is captured rather than hardcoded (a SELinux 1400 has "avc:" here
  #     and still will not match).
  #   - that the audit(<epoch>:<serial>) id is noise. It is the key that ties
  #     this record to its SYSCALL/PATH siblings and to the same event as seen
  #     via auditd.yaml, so it is captured -- verbatim as kernel_audit_id (a
  #     float conversion cannot round-trip .100/.000) and split out as
  #     kernel_audit_epoch/kernel_audit_serial.
  #
  # mac_result is the normalized, LSM-agnostic verdict shared with the AVC and
  # AppArmor patterns in share/auditd.yaml -- lowercased by convert, so
  # "mac_result eq 'denied'" holds whether the record came from SELinux or
  # AppArmor and whether it arrived via auditd or via the ring buffer.
  # kernel_apparmor_mode keeps the raw value for the existing consumers.
  KERNEL_LINUX_APPARMOR: '[% KERNEL_PRINTK %]audit: type=(?<kernel_audit_type>[% INT %]) audit\((?<kernel_audit_id>(?<kernel_audit_epoch>[% NUMBER %]):(?<kernel_audit_serial>[% INT %]))\): apparmor="(?<mac_result>(?<kernel_apparmor_mode>[% WORD %]))"(?: +(?<kernel_apparmor_kv>[% GREEDYDATA %]))?'
  # USB device attach: "usb 1-1: new high-speed USB device number 5 using
  # ehci-hcd"
  KERNEL_LINUX_USB: '[% KERNEL_PRINTK %]usb (?<kernel_usb>[% NOTSPACE %]): new [% GREEDYDATA %]'
  # ---- Linux network stack under pressure or under attack ----
  #
  # The three the stack complains about that are worth waking up for.  All
  # three arrive with PROGRAM=kernel like everything else here, and all three
  # were previously misses, which is the worst way for them to arrive: the
  # host says it is being flooded and nothing downstream hears it.
  #
  # "TCP: request_sock_TCP: Possible SYN flooding on port 80. Sending cookies.
  #  Check SNMP counters."
  #
  # The wording has drifted a lot across releases -- a doubled "TCP: ", a
  # "request_sock_<proto>: " tag, a lowercase "possible", a trailing hint to
  # check SNMP -- and 6.x prints the local address alongside the port as
  # "[::ffff:192.0.2.1]:80".  All of it is optional here except the sentence
  # itself, since which variant a host emits is a function of its kernel
  # version and says nothing about the event.
  KERNEL_LINUX_SYNFLOOD: '[% KERNEL_PRINTK %](?:TCP: )?(?:request_sock_[A-Za-z0-9_]+: )?(?:TCP: )?[Pp]ossible SYN flooding on port (?:\[(?<kernel_syn_local_addr>[^\]]+)\]:)?(?<kernel_syn_port>[% INT %])\. Sending (?<kernel_syn_action>[% WORD %])\.(?: +[% GREEDYDATA %])?'
  # "nf_conntrack: nf_conntrack: table full, dropping packet"
  #
  # The connection tracker is out of room and the host has started dropping
  # traffic it would otherwise have passed.  The module name is doubled on
  # newer kernels because the subsystem prefix and the message both carry it;
  # the old ip_conntrack spelling is still around on long-lived hosts.
  KERNEL_LINUX_CONNTRACK_FULL: '[% KERNEL_PRINTK %](?<kernel_conntrack_module>nf_conntrack|ip_conntrack): (?:(?:nf|ip)_conntrack: )?table full, dropping packet\.?(?: [% GREEDYDATA %])?'
  # "IPv4: martian source 192.0.2.1 from 10.0.0.1, on dev eth0"
  #
  # A packet arrived whose addressing cannot be right -- the classic signature
  # of spoofing or of a routing loop.
  #
  # The kernel prints the destination first and the source second, despite the
  # message reading "martian source <a> from <b>", so the captures are named
  # for what each address actually is rather than for its position in the
  # sentence.  Naming them the other way round would put the wrong address in
  # front of the geoip lookup.
  KERNEL_LINUX_MARTIAN: '[% KERNEL_PRINTK %](?:IPv4: )?martian (?<kernel_martian_kind>source|destination) (?<kernel_martian_dst_ip>[% IP %]) from (?<kernel_martian_src_ip>[% IP %]), (?:on )?dev (?<kernel_martian_iface>[% NOTSPACE %])(?: [% GREEDYDATA %])?'
  # ==================================================================
  # FreeBSD kernel messages (additive). These arrive with PROGRAM=kernel
  # exactly like the Linux ones above and share the //^kernel$// gate.
  # NOTE: FreeBSD firewall lines that start with "ipfw:" are deliberately
  # NOT matched here; they are owned by share/ipfw.yaml.
  # ==================================================================
  # ---- TIER A: security / resource ----
  # process signal exit (segfault analog): "pid 48822 (httpd), jid 0, uid 80:
  # exited on signal 11 (core dumped)". The trailing "(core dumped)" is optional.
  KERNEL_FBSD_SIGEXIT: 'pid (?<kernel_pid>[% INT %]) \((?<kernel_comm>[^)]+)\), jid (?<kernel_jid>[% INT %]), uid (?<kernel_uid>[% INT %]): exited on signal (?<kernel_signal>[% INT %])(?: \((?<kernel_core>core dumped)\))?(?: [% GREEDYDATA %])?'
  # out-of-swap kill (OOM analog): "pid 1234 (mysqld), jid 0, uid 88, was
  # killed: out of swap space".
  KERNEL_FBSD_SWAPKILL: 'pid (?<kernel_pid>[% INT %]) \((?<kernel_comm>[^)]+)\), jid (?<kernel_jid>[% INT %]), uid (?<kernel_uid>[% INT %]), was killed: (?<kernel_kill_reason>[% GREEDYDATA %])'
  # swap allocation failure: "swap_pager_getswapspace(16): failed".
  KERNEL_FBSD_SWAPFAIL: 'swap_pager_getswapspace\((?<kernel_swap_count>[% INT %])\): failed(?: [% GREEDYDATA %])?'
  # DoS-mitigation rate limiters: "Limiting closed port RST response from 400
  # to 200 packets/sec" / "Limiting icmp unreach response from 200 to 100
  # packets/sec" / "Limiting open port RST response ...".
  KERNEL_FBSD_LIMIT: 'Limiting (?<kernel_limit_type>[A-Za-z ]+?) response from (?<kernel_limit_from>[% INT %]) to (?<kernel_limit_to>[% INT %]) packets/sec(?: [% GREEDYDATA %])?'
  # listen-queue overflow (SYN-flood signal): "sonewconn: pcb 0xfffff800:
  # Listen queue overflow: 193 already in queue awaiting acceptance (5
  # occurrences)".
  KERNEL_FBSD_LISTENQ: 'sonewconn: pcb (?<kernel_listenq_pcb>[% NOTSPACE %]): Listen queue overflow: (?<kernel_listenq_depth>[% INT %]) already in queue awaiting acceptance \((?<kernel_listenq_occurrences>[% INT %]) occurrences?\)(?: [% GREEDYDATA %])?'
  # ARP anomaly: "arp: 192.0.2.5 moved from aa:bb:cc:dd:ee:ff to
  # 11:22:33:44:55:66 on em0". (LAN IP -> no geoip.)
  KERNEL_FBSD_ARP: 'arp: (?<kernel_arp_ip>[% IP %]) moved from (?<kernel_arp_from_mac>[% COMMONMAC %]) to (?<kernel_arp_to_mac>[% COMMONMAC %]) on (?<kernel_arp_iface>[% NOTSPACE %])(?: [% GREEDYDATA %])?'
  # ---- TIER B: storage / hardware ----
  # CAM/ATA device error: "(ada0:ahcich0:0:0:0): CAM status: Command timeout".
  KERNEL_FBSD_CAM: '\((?<kernel_cam_device>[^)]+)\): CAM status: (?<kernel_cam_status>[% GREEDYDATA %])'
  # ATA disk failure: "ada0: FAILURE - READ_DMA48. ACB: ...".
  KERNEL_FBSD_DISK: '(?<kernel_disk>[a-z]+[0-9]+): FAILURE - (?<kernel_disk_failure>[% GREEDYDATA %])'
  # GEOM VFS I/O error: "g_vfs_done():ada0p2[READ(offset=12345,
  # length=4096)]error = 5".
  KERNEL_FBSD_GEOM_IO: 'g_vfs_done\(\):(?<kernel_geom_provider>[^\[]+)\[(?<kernel_geom_op>[% WORD %])\([^\]]*\)\]error = (?<kernel_geom_error>[% INT %])(?: [% GREEDYDATA %])?'
  # GEOM class events (mirror/eli/...): "GEOM_MIRROR: Device gm0: provider ada1
  # disconnected." / "GEOM_ELI: Device ada0p3.eli created.".
  KERNEL_FBSD_GEOM_EVENT: '(?<kernel_geom_class>GEOM_[A-Z]+): (?<kernel_geom_message>[% GREEDYDATA %])'
  # ZFS Solaris-style pool message: "Solaris: WARNING: Pool 'tank' has
  # encountered an uncorrectable I/O failure and has been suspended.".
  KERNEL_FBSD_ZFS_MSG: 'Solaris: (?<kernel_zfs_message>[% GREEDYDATA %])'
  # ZFS vdev state change: "ZFS: vdev state changed, pool_guid=123
  # vdev_guid=456".
  KERNEL_FBSD_ZFS_VDEV: 'ZFS: vdev state changed, pool_guid=(?<kernel_zfs_pool_guid>[% NOTSPACE %]) vdev_guid=(?<kernel_zfs_vdev_guid>[% NOTSPACE %])(?: [% GREEDYDATA %])?'
  # ---- TIER C: routine ops ----
  # link state change: "em0: link state changed to DOWN" / "... to UP".
  KERNEL_FBSD_LINK: '(?<kernel_iface>[a-z]+[0-9]+): link state changed to (?<kernel_link_state>[% WORD %])(?: [% GREEDYDATA %])?'
  # USB device attach (FreeBSD ugen): "ugen0.3: <vendor product> at usbus0".
  KERNEL_FBSD_UGEN: '(?<kernel_usb_dev>ugen[0-9]+\.[0-9]+): <(?<kernel_usb_desc>[^>]*)> at (?<kernel_usb_bus>[% NOTSPACE %])(?: [% GREEDYDATA %])?'
  # CAM device probe attach: "da0 at umass-sim0 bus 0 scbus0 target 0 lun 0".
  KERNEL_FBSD_CAM_ATTACH: '(?<kernel_usb_dev>[a-z]+[0-9]+) at (?<kernel_usb_desc>[% NOTSPACE %]) bus [% GREEDYDATA %]'
  # ---- fatal (single-line only) ----
  # "panic: page fault".
  KERNEL_FBSD_PANIC: 'panic: (?<kernel_panic>[% GREEDYDATA %])'
  # "Fatal trap 12: page fault while in kernel mode".
  KERNEL_FBSD_FATAL_TRAP: 'Fatal trap (?<kernel_trap_num>[% INT %]): (?<kernel_trap_desc>[% GREEDYDATA %])'
vars_tests:
  # ---- the shared printk prefix ----
  # The whole fragment is optional, so under an anchored ^...$ template a
  # string it cannot consume entirely is a negative: no dot in the uptime, no
  # trailing space, or an ordinary message with no prefix to begin with.
  KERNEL_PRINTK:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '[ 9134.220118] '
        result: '[ 9134.220118] '
      - string: '[    0.000000] '
        result: '[    0.000000] '
      - string: '[12345.678901]  '
        result: '[12345.678901]  '
    negative:
      # no fractional part
      - '[1234] '
      # the trailing space is part of the fragment
      - '[ 9134.220118]'
      # an ordinary message, prefix or no prefix
      - 'audit: type=1400'
  # ---- Linux vars_tests (KERNEL_LINUX_*) ----
  KERNEL_LINUX_OOM:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'Out of memory: Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB, UID:999 pgtables:1kB oom_score_adj:0'
        result: 'Out of memory: Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB, UID:999 pgtables:1kB oom_score_adj:0'
      - string: 'Out of memory: Killed process 4567 (java) total-vm:2000kB, anon-rss:1500kB, file-rss:0kB, shmem-rss:0kB'
        result: 'Out of memory: Killed process 4567 (java) total-vm:2000kB, anon-rss:1500kB, file-rss:0kB, shmem-rss:0kB'
    negative:
      - 'Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB'
  KERNEL_LINUX_OOM_OLD:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB'
        result: 'Killed process 1234 (mysqld) total-vm:100kB, anon-rss:50kB, file-rss:0kB, shmem-rss:0kB'
      - string: 'Killed process 999 (sshd) total-vm:512kB, anon-rss:256kB'
        result: 'Killed process 999 (sshd) total-vm:512kB, anon-rss:256kB'
    negative:
      - 'Out of memory: Killed process 1234 (mysqld) total-vm:100kB'
  KERNEL_LINUX_BRIDGE_PORT:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '[ 4391.338436] br-lan: port 10(phy0-ap2) entered disabled state'
        result: '[ 4391.338436] br-lan: port 10(phy0-ap2) entered disabled state'
      # with the printk uptime stripped by the reader
      - string: 'br0: port 2(veth1a2b3c) entered forwarding state'
        result: 'br0: port 2(veth1a2b3c) entered forwarding state'
    negative:
      - 'eth0: entered promiscuous mode'
  KERNEL_LINUX_NETDEV_MODE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '[ 4684.598846] mwlwifi 0000:01:00.0 phy0-ap2: entered promiscuous mode'
        result: '[ 4684.598846] mwlwifi 0000:01:00.0 phy0-ap2: entered promiscuous mode'
      - string: 'mwlwifi 0000:01:00.0 phy0-ap2 (unregistering): left allmulticast mode'
        result: 'mwlwifi 0000:01:00.0 phy0-ap2 (unregistering): left allmulticast mode'
      - string: 'eth0: entered promiscuous mode'
        result: 'eth0: entered promiscuous mode'
    negative:
      - 'br-lan: port 10(phy0-ap2) entered disabled state'
  KERNEL_LINUX_LINK:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '[4902418.465459] mv88e6085 f1072004.mdio-mii:00 lan2: Link is Down'
        result: '[4902418.465459] mv88e6085 f1072004.mdio-mii:00 lan2: Link is Down'
      - string: 'igb 0000:04:00.0 eth0: Link is Up - 1Gbps/Full - flow control rx/tx'
        result: 'igb 0000:04:00.0 eth0: Link is Up - 1Gbps/Full - flow control rx/tx'
    negative:
      - 'eth0: entered promiscuous mode'
  KERNEL_LINUX_SEGV:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'php[12345]: segfault at 0 ip 00007f00 sp 00007ffe error 4 in libc-2.31.so[7f00+1c000]'
        result: 'php[12345]: segfault at 0 ip 00007f00 sp 00007ffe error 4 in libc-2.31.so[7f00+1c000]'
      - string: 'nginx[6789]: segfault at 10 ip 0000562a sp 00007ffd error 6 in nginx[562a+80000]'
        result: 'nginx[6789]: segfault at 10 ip 0000562a sp 00007ffd error 6 in nginx[562a+80000]'
    negative:
      - 'traps: nginx[1234] general protection ip:0 sp:0 error:0 in libc[0+1000]'
  KERNEL_LINUX_TRAP:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'traps: nginx[1234] general protection ip:00007f00 sp:00007ffe error:0 in libc-2.31.so[7f00+1c000]'
        result: 'traps: nginx[1234] general protection ip:00007f00 sp:00007ffe error:0 in libc-2.31.so[7f00+1c000]'
      - string: 'traps: php[9999] general protection ip:0000562a sp:00007ffd error:0 in php[562a+80000]'
        result: 'traps: php[9999] general protection ip:0000562a sp:00007ffd error:0 in php[562a+80000]'
    negative:
      - 'php[12345]: segfault at 0 ip 00007f00 sp 00007ffe error 4 in libc-2.31.so[7f00+1c000]'
  KERNEL_LINUX_EXT_FS:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'EXT4-fs error (device sda1): ext4_find_entry:1234: inode #2: comm ls: reading directory lblock 0'
        result: 'EXT4-fs error (device sda1): ext4_find_entry:1234: inode #2: comm ls: reading directory lblock 0'
      - string: 'EXT4-fs error (device dm-0): ext4_lookup:1600: inode #131074: comm bash: deleted inode referenced: 12'
        result: 'EXT4-fs error (device dm-0): ext4_lookup:1600: inode #131074: comm bash: deleted inode referenced: 12'
    negative:
      - 'XFS (sda1): Metadata corruption detected'
  KERNEL_LINUX_XFS:
