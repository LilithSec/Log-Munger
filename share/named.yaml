---
# named / BIND9 query-log enrichment.
#
# Gates on the syslog PROGRAM field being "named". Patterns are anchored (each
# must match the whole MESSAGE) and first-match wins. Every capture is
# namespaced with dns_ .
#
# BIND query-log lines look like:
#   client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)
# The "@0x..." internal address token is optional, as is the trailing
# "(server_ip)" reporting which local address answered.
includes:
- base
vars_templated:
  # A single BIND9 query-log line. Tolerates the optional "@0x..." client
  # address token and the optional trailing "(server_ip)".
  NAMED_QUERY: 'client(?: @0x[0-9a-fA-F]+)? (?<dns_client_ip>[% IP %])#(?<dns_client_port>[% INT %])(?: \([% DATA %]\))?: query: (?<dns_query_name>[% NOTSPACE %]) (?<dns_query_class>[% WORD %]) (?<dns_query_type>[% WORD %]) (?<dns_flags>[% NOTSPACE %])(?: \((?<dns_server_ip>[% IP %])\))?'
vars_tests:
  NAMED_QUERY:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)'
        result: 'client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)'
      - string: 'client 198.51.100.9#40000 (test.org): query: test.org IN AAAA + (192.0.2.1)'
        result: 'client 198.51.100.9#40000 (test.org): query: test.org IN AAAA + (192.0.2.1)'
    negative:
      - 'this is not a named query line at all'
# file-level default: geoip lookup on the client IP (only used when the munger
# is built with a geoip database).
geoip:
  - dns_client_ip
# file-level default: coerce the client port to an integer at runtime.
convert:
  dns_client_port: int
rules:
  - name: named
    gate:
      - field: PROGRAM
        values:
          - '//^named$//'
    field: MESSAGE
    anchored: true
    patterns:
      - NAMED_QUERY
    tests:
      positive:
        - string: 'client @0x7f8b1c0d5e00 192.0.2.5#54321 (example.com): query: example.com IN A +E(0)K (192.0.2.1)'
          result:
            dns_client_ip: '192.0.2.5'
            dns_client_port: '54321'
            dns_query_name: 'example.com'
            dns_query_class: 'IN'
            dns_query_type: 'A'
            dns_flags: '+E(0)K'
            dns_server_ip: '192.0.2.1'
        - string: 'client 198.51.100.9#40000 (test.org): query: test.org IN AAAA + (192.0.2.1)'
          result:
            dns_client_ip: '198.51.100.9'
            dns_client_port: '40000'
            dns_query_name: 'test.org'
            dns_query_class: 'IN'
            dns_query_type: 'AAAA'
            dns_flags: '+'
            dns_server_ip: '192.0.2.1'
        - string: 'client @0x55a 203.0.113.7#1234 (a.b.c): query: a.b.c IN MX +E (192.0.2.1)'
          result:
            dns_client_ip: '203.0.113.7'
            dns_client_port: '1234'
            dns_query_name: 'a.b.c'
            dns_query_class: 'IN'
            dns_query_type: 'MX'
            dns_flags: '+E'
            dns_server_ip: '192.0.2.1'
      negative:
        - 'this is not a named line at all'
        - 'Jul 15 10:00:00 host sshd[123]: Accepted publickey for kitsune'
