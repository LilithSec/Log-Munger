---
# Unbound query-log enrichment.
#
# With "log-queries: yes" set, unbound emits one line per query of the shape:
#   info: <client-ip> <query-name> <query-type> <query-class>
# e.g. "info: 192.0.2.5 example.com. A IN". After the syslog header the
# MESSAGE is that "info: ..." tail.
#
# The rule gates on the "unbound" PROGRAM, matches the whole MESSAGE (anchored)
# and namespaces every capture with unbound_. The client IP is fed to geoip.
includes:
- base
vars_templated:
  UNBOUND_QUERY: 'info: (?<unbound_client_ip>[% IP %]) (?<unbound_query_name>[% NOTSPACE %]) (?<unbound_query_type>[% WORD %]) (?<unbound_query_class>[% WORD %])'
vars_tests:
  UNBOUND_QUERY:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'info: 192.0.2.5 example.com. A IN'
        result: 'info: 192.0.2.5 example.com. A IN'
      - string: 'info: 198.51.100.9 test.org. AAAA IN'
        result: 'info: 198.51.100.9 test.org. AAAA IN'
    negative:
      - 'this is not an unbound query line at all'
# file-level default: geoip lookup on the client IP (only used when the munger
# is built with a geoip database).
geoip:
  - unbound_client_ip
rules:
  - name: unbound
    gate:
      - field: PROGRAM
        values:
          - '//^unbound$//'
    field: MESSAGE
    anchored: true
    patterns:
      - UNBOUND_QUERY
    tests:
      positive:
        - string: 'info: 192.0.2.5 example.com. A IN'
          result:
            unbound_client_ip: '192.0.2.5'
            unbound_query_name: 'example.com.'
            unbound_query_type: 'A'
            unbound_query_class: 'IN'
        - string: 'info: 198.51.100.9 test.org. AAAA IN'
          result:
            unbound_client_ip: '198.51.100.9'
            unbound_query_name: 'test.org.'
            unbound_query_type: 'AAAA'
            unbound_query_class: 'IN'
        - string: 'info: 203.0.113.7 a.b.c. MX IN'
          result:
            unbound_client_ip: '203.0.113.7'
            unbound_query_name: 'a.b.c.'
            unbound_query_type: 'MX'
            unbound_query_class: 'IN'
      negative:
        - 'this is not an unbound query line at all'
        - 'Jul 15 10:00:00 host sshd[123]: Accepted publickey for kitsune'
