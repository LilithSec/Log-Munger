---
# hostapd (WiFi access point daemon) client association / authentication log
# enrichment.
#
# Gates on the syslog PROGRAM field being "hostapd". The MESSAGE is normally
# prefixed with the AP interface (e.g. "wlan0: STA aa:bb:cc:dd:ee:ff IEEE
# 802.11: associated (aid 1)"). Patterns are anchored (each must match the whole
# MESSAGE) and first-match wins. Every capture is namespaced with hostapd_ .
#
#   hostapd_iface     -> the AP interface (wlan0, ...)
#   hostapd_sta       -> the client (station) MAC address
#   hostapd_event     -> the event text / control-event name
#   hostapd_subsystem -> the reporting subsystem for STA lines
#                        (IEEE 802.11 / IEEE 802.1X / WPA / RADIUS / MLME / WPS)
includes:
- base
vars_templated:
  # ctrl-event: a station (dis)connected. "wlan0: AP-STA-CONNECTED <mac> [kv...]"
  HOSTAPD_AP_STA_CONNECTED: '(?<hostapd_iface>[% NOTSPACE %]): (?<hostapd_event>AP-STA-CONNECTED) (?<hostapd_sta>[% COMMONMAC %])(?: [% GREEDYDATA %])?'
  HOSTAPD_AP_STA_DISCONNECTED: '(?<hostapd_iface>[% NOTSPACE %]): (?<hostapd_event>AP-STA-DISCONNECTED) (?<hostapd_sta>[% COMMONMAC %])(?: [% GREEDYDATA %])?'
  # per-station events: "<iface>: STA <mac> <subsystem>: <event>" where the
  # subsystem is IEEE 802.11 / IEEE 802.1X / WPA / RADIUS / MLME / WPS. The
  # subsystem is captured up to the first ":" (it never contains one); the event
  # is the remainder (which may contain colons, e.g. an embedded MAC).
  HOSTAPD_STA: '(?<hostapd_iface>[% NOTSPACE %]): STA (?<hostapd_sta>[% COMMONMAC %]) (?<hostapd_subsystem>[^:]+): (?<hostapd_event>[% GREEDYDATA %])'
  # interface state machine: "<iface>: interface state ENABLED->DISABLED"
  HOSTAPD_IFACE_STATE: '(?<hostapd_iface>[% NOTSPACE %]): interface state (?<hostapd_state_from>[% NOTSPACE %])->(?<hostapd_state_to>[% NOTSPACE %])(?: [% GREEDYDATA %])?'
  # AP up/down control events: "<iface>: AP-ENABLED" / "<iface>: AP-DISABLED"
  HOSTAPD_AP_STATE: '(?<hostapd_iface>[% NOTSPACE %]): (?<hostapd_event>AP-ENABLED|AP-DISABLED)(?: [% GREEDYDATA %])?'
vars_tests:
  HOSTAPD_AP_STA_CONNECTED:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'wlan0: AP-STA-CONNECTED aa:bb:cc:dd:ee:ff'
        result: 'wlan0: AP-STA-CONNECTED aa:bb:cc:dd:ee:ff'
      - string: 'wlan1: AP-STA-CONNECTED 11:22:33:44:55:66 auth_alg=open'
        result: 'wlan1: AP-STA-CONNECTED 11:22:33:44:55:66 auth_alg=open'
    negative:
      - 'wlan0: AP-STA-DISCONNECTED aa:bb:cc:dd:ee:ff'
  HOSTAPD_AP_STA_DISCONNECTED:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'wlan0: AP-STA-DISCONNECTED aa:bb:cc:dd:ee:ff'
        result: 'wlan0: AP-STA-DISCONNECTED aa:bb:cc:dd:ee:ff'
      - string: 'wlan1: AP-STA-DISCONNECTED 11:22:33:44:55:66'
        result: 'wlan1: AP-STA-DISCONNECTED 11:22:33:44:55:66'
    negative:
      - 'wlan0: AP-STA-CONNECTED aa:bb:cc:dd:ee:ff'
  HOSTAPD_STA:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'wlan0: STA aa:bb:cc:dd:ee:ff IEEE 802.11: associated (aid 1)'
        result: 'wlan0: STA aa:bb:cc:dd:ee:ff IEEE 802.11: associated (aid 1)'
      - string: 'wlan0: STA aa:bb:cc:dd:ee:ff WPA: pairwise key handshake completed (RSN)'
        result: 'wlan0: STA aa:bb:cc:dd:ee:ff WPA: pairwise key handshake completed (RSN)'
    negative:
      - 'wlan0: AP-STA-CONNECTED aa:bb:cc:dd:ee:ff'
  HOSTAPD_IFACE_STATE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'wlan0: interface state UNINITIALIZED->COUNTRY_UPDATE'
        result: 'wlan0: interface state UNINITIALIZED->COUNTRY_UPDATE'
      - string: 'wlan0: interface state ENABLED->DISABLED'
        result: 'wlan0: interface state ENABLED->DISABLED'
    negative:
      - 'wlan0: AP-ENABLED'
  HOSTAPD_AP_STATE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'wlan0: AP-ENABLED'
        result: 'wlan0: AP-ENABLED'
      - string: 'wlan0: AP-DISABLED'
        result: 'wlan0: AP-DISABLED'
    negative:
      - 'wlan0: interface state ENABLED->DISABLED'
rules:
  - name: hostapd
    gate:
      - field: PROGRAM
        values:
          - '//^hostapd$//'
    field: MESSAGE
    anchored: true
    patterns:
      - HOSTAPD_AP_STA_CONNECTED
      - HOSTAPD_AP_STA_DISCONNECTED
      - HOSTAPD_STA
      - HOSTAPD_IFACE_STATE
      - HOSTAPD_AP_STATE
    tests:
      positive:
        - string: 'wlan0: AP-STA-CONNECTED aa:bb:cc:dd:ee:ff'
          result:
            hostapd_iface: 'wlan0'
            hostapd_event: 'AP-STA-CONNECTED'
            hostapd_sta: 'aa:bb:cc:dd:ee:ff'
        - string: 'wlan0: AP-STA-DISCONNECTED aa:bb:cc:dd:ee:ff'
          result:
            hostapd_iface: 'wlan0'
            hostapd_event: 'AP-STA-DISCONNECTED'
            hostapd_sta: 'aa:bb:cc:dd:ee:ff'
        - string: 'wlan0: STA aa:bb:cc:dd:ee:ff IEEE 802.11: associated (aid 1)'
          result:
            hostapd_iface: 'wlan0'
            hostapd_sta: 'aa:bb:cc:dd:ee:ff'
            hostapd_subsystem: 'IEEE 802.11'
            hostapd_event: 'associated (aid 1)'
        - string: 'wlan0: STA aa:bb:cc:dd:ee:ff IEEE 802.11: deauthenticated due to local deauth request'
          result:
            hostapd_iface: 'wlan0'
            hostapd_sta: 'aa:bb:cc:dd:ee:ff'
            hostapd_subsystem: 'IEEE 802.11'
            hostapd_event: 'deauthenticated due to local deauth request'
        - string: 'wlan0: STA aa:bb:cc:dd:ee:ff WPA: pairwise key handshake completed (RSN)'
          result:
            hostapd_iface: 'wlan0'
            hostapd_sta: 'aa:bb:cc:dd:ee:ff'
            hostapd_subsystem: 'WPA'
            hostapd_event: 'pairwise key handshake completed (RSN)'
        - string: 'wlan0: interface state ENABLED->DISABLED'
          result:
            hostapd_iface: 'wlan0'
            hostapd_state_from: 'ENABLED'
            hostapd_state_to: 'DISABLED'
        - string: 'wlan0: AP-ENABLED'
          result:
            hostapd_iface: 'wlan0'
            hostapd_event: 'AP-ENABLED'
      negative:
        - 'this is not a hostapd line at all'
        - 'Jul 15 10:00:00 host cron[123]: session opened for user root'
