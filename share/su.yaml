---
# util-linux su (switch-user) log enrichment.
#
# Gates on the syslog PROGRAM field being "su".  Patterns are anchored (each
# must match the whole MESSAGE) and first-match wins.  Every capture is
# namespaced with su_ .
#
# Three shapes are handled:
#   * the classic "(to TARGET) BYUSER on TTY" line, optionally prefixed with
#     "FAILED SU " (a failed switch, su_result=FAILED) or "su: ".
#   * the pam/auth style success line: "+ TTY BYUSER:TARGET"
#   * the pam/auth style failure line: "- TTY BYUSER:TARGET"
#
# The generic pam_unix(su:...) session/auth lines are handled by pam.yaml.
includes:
- base
vars_templated:
  # "(to root) kitsune on pts/0" and "FAILED SU (to root) kitsune on pts/0"
  # (and the "su: (to ...)" variant).  su_result is only present on failures.
  SU_TO: '(?:(?<su_result>FAILED) SU |su: )?\(to (?<su_target_user>[% USERNAME %])\) (?<su_by_user>[% USERNAME %]) on (?<su_tty>[% NOTSPACE %])'
  # success: "+ pts/0 kitsune:root"
  SU_SUCCESS: '\+ (?<su_tty>[% NOTSPACE %]) (?<su_by_user>[% USERNAME %]):(?<su_target_user>[% USERNAME %])'
  # failure: "- pts/0 kitsune:root"
  SU_FAILURE: '- (?<su_tty>[% NOTSPACE %]) (?<su_by_user>[% USERNAME %]):(?<su_target_user>[% USERNAME %])'
vars_tests:
  SU_TO:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '(to root) kitsune on pts/0'
        result: '(to root) kitsune on pts/0'
      - string: 'FAILED SU (to root) kitsune on pts/0'
        result: 'FAILED SU (to root) kitsune on pts/0'
    negative:
      - '+ pts/0 kitsune:root'
  SU_SUCCESS:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '+ pts/0 kitsune:root'
        result: '+ pts/0 kitsune:root'
      - string: '+ /dev/pts/1 alice:root'
        result: '+ /dev/pts/1 alice:root'
    negative:
      - '- pts/0 kitsune:root'
  SU_FAILURE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '- pts/0 kitsune:root'
        result: '- pts/0 kitsune:root'
    negative:
      - '+ pts/0 kitsune:root'
rules:
  - name: su
    gate:
      - field: PROGRAM
        values:
          - '//^su$//'
    field: MESSAGE
    anchored: true
    patterns:
      - SU_TO
      - SU_SUCCESS
      - SU_FAILURE
    tests:
      positive:
        - string: '(to root) kitsune on pts/0'
          result:
            su_target_user: 'root'
            su_by_user: 'kitsune'
            su_tty: 'pts/0'
        - string: 'FAILED SU (to root) kitsune on pts/0'
          result:
            su_result: 'FAILED'
            su_target_user: 'root'
            su_by_user: 'kitsune'
            su_tty: 'pts/0'
        - string: '+ pts/0 kitsune:root'
          result:
            su_tty: 'pts/0'
            su_by_user: 'kitsune'
            su_target_user: 'root'
        - string: '- pts/0 kitsune:root'
          result:
            su_tty: 'pts/0'
            su_by_user: 'kitsune'
            su_target_user: 'root'
        - string: '+ /dev/pts/1 alice:root'
          result:
            su_tty: '/dev/pts/1'
            su_by_user: 'alice'
            su_target_user: 'root'
      negative:
        - 'this is not a valid su line at all'
