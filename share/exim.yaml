        result: '1rABCD-0001Ab-2x F=<a@b> H=(helo) [203.0.113.7]:43671 I=[192.0.2.1]:25 P=esmtp rejected by local_scan(): Rejected'
      - string: '1rABCD-0001Ab-2x F=a@b H=mail.example.com [203.0.113.7] P=smtp rejected by local_scan(): Rejected: hits=7.5 required=5.0 trigger=5.0'
        result: '1rABCD-0001Ab-2x F=a@b H=mail.example.com [203.0.113.7] P=smtp rejected by local_scan(): Rejected: hits=7.5 required=5.0 trigger=5.0'
    negative:
      - 'H=(helo) [203.0.113.7] F=<a@b> rejected RCPT <c@d>: relay not permitted'
  EXIM_MSGID:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x'
        result: '1rABCD-0001Ab-2x'
      - string: '1rABCD-0001Ab2xY3z-AbCd'
        result: '1rABCD-0001Ab2xY3z-AbCd'
    negative:
      - 'H=mail.example.com'
  EXIM_NO_HOST_NAME:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'no host name found for IP address 203.0.113.7'
        result: 'no host name found for IP address 203.0.113.7'
    negative:
      - 'no host name found for IP address mail.example.com'
  EXIM_NO_IP_FOR_HOST:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'no IP address found for host mail.example.com (during SMTP connection from [203.0.113.7])'
        result: 'no IP address found for host mail.example.com (during SMTP connection from [203.0.113.7])'
      - string: 'no IP address found for host mail.example.com (during SMTP connection from [203.0.113.7]:49390 I=[192.0.2.1]:25)'
        result: 'no IP address found for host mail.example.com (during SMTP connection from [203.0.113.7]:49390 I=[192.0.2.1]:25)'
    negative:
      - 'no host name found for IP address 203.0.113.7'
  EXIM_NO_MAIL:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'no MAIL in SMTP connection from (helo) [203.0.113.7]:20042 I=[192.0.2.1]:25 Ci=8001 D=0.349s C=EHLO,AUTH,QUIT'
        result: 'no MAIL in SMTP connection from (helo) [203.0.113.7]:20042 I=[192.0.2.1]:25 Ci=8001 D=0.349s C=EHLO,AUTH,QUIT'
      - string: '[5908] no MAIL in SMTP connection from [203.0.113.7] I=[192.0.2.1]:25 D=10s'
        result: '[5908] no MAIL in SMTP connection from [203.0.113.7] I=[192.0.2.1]:25 D=10s'
    negative:
      - 'SMTP connection from [203.0.113.7] lost'
  EXIM_PID:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '[1234] '
        result: '[1234] '
      - string: ''
        result: ''
    negative:
      - '[abc] '
  EXIM_SA_ACTION:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x SA: Action: flagged as Spam but accepted: score=8.2 required=5.0 (scanned in 6/6 secs | Message-Id: abc@example.com). From <a@example.com> (host=mail.example.com [203.0.113.7]) for b@example.org'
        result: '1rABCD-0001Ab-2x SA: Action: flagged as Spam but accepted: score=8.2 required=5.0 (scanned in 6/6 secs | Message-Id: abc@example.com). From <a@example.com> (host=mail.example.com [203.0.113.7]) for b@example.org'
      - string: '1rABCD-0001Ab-2x SA: Action: silently tossed message: score=35.8 required=5.0 trigger=30.0 (scanned in 6/6 secs | Message-Id: 1rABCD-0001Ab-2x). From <> (host=NULL [203.0.113.7]) for b@example.org'
        result: '1rABCD-0001Ab-2x SA: Action: silently tossed message: score=35.8 required=5.0 trigger=30.0 (scanned in 6/6 secs | Message-Id: 1rABCD-0001Ab-2x). From <> (host=NULL [203.0.113.7]) for b@example.org'
    negative:
      - '1rABCD-0001Ab-2x Completed'
  EXIM_SMTP_PROTOCOL_ERROR:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'SMTP protocol error in "AUTH LOGIN" H=(helo) [203.0.113.7]:4816 I=[192.0.2.1]:25 AUTH command used when not advertised'
        result: 'SMTP protocol error in "AUTH LOGIN" H=(helo) [203.0.113.7]:4816 I=[192.0.2.1]:25 AUTH command used when not advertised'
      - string: 'SMTP protocol error in "aUtH lOgIn" H=(test) [198.51.100.9]" H=(helo) [203.0.113.7] AUTH command used when not advertised'
        result: 'SMTP protocol error in "aUtH lOgIn" H=(test) [198.51.100.9]" H=(helo) [203.0.113.7] AUTH command used when not advertised'
    negative:
      - 'SMTP call from (helo) [203.0.113.7] dropped: too many nonmail commands'
  EXIM_SMTP_SYNC_ERROR:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'SMTP protocol synchronization error (input sent without waiting for greeting): rejected connection from H=[203.0.113.7]:25936 I=[192.0.2.1]:25 input="GET / HTTP/1.1\r\n\r\n"'
        result: 'SMTP protocol synchronization error (input sent without waiting for greeting): rejected connection from H=[203.0.113.7]:25936 I=[192.0.2.1]:25 input="GET / HTTP/1.1\r\n\r\n"'
      - string: 'SMTP protocol synchronization error (next input sent too soon: pipelining was not advertised): rejected "RSET" H=mail.example.com [203.0.113.7]:58302 I=[192.0.2.1]:25 next input="QUIT\r\n"'
        result: 'SMTP protocol synchronization error (next input sent too soon: pipelining was not advertised): rejected "RSET" H=mail.example.com [203.0.113.7]:58302 I=[192.0.2.1]:25 next input="QUIT\r\n"'
    negative:
      - 'SMTP protocol error in "AUTH LOGIN" H=(helo) [203.0.113.7] AUTH command used when not advertised'
  EXIM_VERIFY_FAIL:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'H=mail.example.com [203.0.113.7] sender verify fail for <a@example.com>: Unrouteable address'
        result: 'H=mail.example.com [203.0.113.7] sender verify fail for <a@example.com>: Unrouteable address'
      - string: 'H=(helo) [203.0.113.7]:41234 F=<a@example.com> recipient verify defer for <b@example.org>'
        result: 'H=(helo) [203.0.113.7]:41234 F=<a@example.com> recipient verify defer for <b@example.org>'
    negative:
      - 'H=(helo) [203.0.113.7] F=<a@b> rejected RCPT <c@d>: Sender verify failed'
# Look up any captured source / destination IP.
geoip:
  - exim_src_ip
  - exim_dst_ip
# Coerce the message size and any ports to integers.
convert:
  exim_size: int
  exim_src_port: int
  exim_dst_port: int
  exim_local_port: int
  exim_pid: int
  exim_conn_id: int
  exim_sa_score: float
  exim_sa_required: float
  exim_sa_trigger: float
rules:
  - name: exim
    gate:
      - field: PROGRAM
        values:
          - '//^exim4?$//'
    field: MESSAGE
    anchored: true
    patterns:
      - EXIM_COMPLETED
      - EXIM_ARRIVAL
      - EXIM_DELIVERY
      - EXIM_ADDITIONAL
      - EXIM_DEFERRED
      - EXIM_FAILED
      - EXIM_AUTH_FAILED
      - EXIM_TLS_ERROR
      # the connect-ACL form has no verb and no address, so it goes ahead of
      # the general rejection pattern that expects both
      - EXIM_REJECT_CONNECTION
      - EXIM_LOCAL_SCAN_REJECT
      - EXIM_SA_ACTION
      - EXIM_VERIFY_FAIL
      - EXIM_REJECT
      - EXIM_SMTP_CONNECTION
      - EXIM_NO_MAIL
      - EXIM_SMTP_PROTOCOL_ERROR
      - EXIM_SMTP_SYNC_ERROR
      - EXIM_NO_HOST_NAME
      - EXIM_NO_IP_FOR_HOST
    tests:
      positive:
        - string: '1rABCD-0001Ab-2x <= sender@example.com H=mail.example.com [203.0.113.7] P=esmtp S=1234 id=<abc@x>'
          numeric:
            - exim_size
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_flag: '<='
            exim_sender: 'sender@example.com'
            exim_h_host: 'mail.example.com'
            exim_src_ip: '203.0.113.7'
            exim_proto: 'esmtp'
            exim_size: '1234'
            exim_id: '<abc@x>'
        - string: '1rABCD-0001Ab-2x => recipient@example.net R=dnslookup T=remote_smtp H=mx.example.net [198.51.100.2] X=TLS1.3 C="250 OK"'
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_flag: '=>'
            exim_recipient: 'recipient@example.net'
            exim_router: 'dnslookup'
            exim_transport: 'remote_smtp'
            exim_h_host: 'mx.example.net'
            exim_dst_ip: '198.51.100.2'
        - string: '1rABCD-0001Ab-2x -> extra@example.net R=dnslookup T=remote_smtp H=mx.example.net [198.51.100.2]'
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_flag: '->'
            exim_recipient: 'extra@example.net'
            exim_router: 'dnslookup'
            exim_transport: 'remote_smtp'
            exim_h_host: 'mx.example.net'
            exim_dst_ip: '198.51.100.2'
        - string: '1rABCD-0001Ab-2x == recipient@example.net R=dnslookup T=remote_smtp defer (-53): retry time not reached'
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_flag: '=='
            exim_recipient: 'recipient@example.net'
            exim_router: 'dnslookup'
            exim_transport: 'remote_smtp'
            exim_defer_reason: 'defer (-53): retry time not reached'
        - string: '1rABCD-0001Ab-2x ** recipient@example.net R=dnslookup T=remote_smtp: SMTP error from remote mail server after RCPT TO:<recipient@example.net>: 550 No such user'
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_flag: '**'
            exim_recipient: 'recipient@example.net'
            exim_router: 'dnslookup'
            exim_transport: 'remote_smtp'
            exim_error: 'SMTP error from remote mail server after RCPT TO:<recipient@example.net>: 550 No such user'
        - string: '1rABCD-0001Ab-2x Completed'
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_completed: 'Completed'
        - string: 'H=(helo) [203.0.113.7] F=<spammer@x> rejected RCPT <victim@example.com>: relay not permitted'
          result:
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_sender: 'spammer@x'
            exim_reject_verb: 'RCPT'
            exim_recipient: 'victim@example.com'
            exim_reject_reason: 'relay not permitted'
        # -- authentication, TLS and connection handling --
        - string: 'login authenticator failed for (helo) [203.0.113.7]: 535 Incorrect authentication data (set_id=admin)'
          program: 'exim4'
          result:
            exim_authenticator: 'login'
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_auth_error: '535 Incorrect authentication data'
            exim_auth_user: 'admin'
        - string: 'plain authenticator failed for (helo) [203.0.113.7]: 535 Incorrect authentication data'
          result:
            exim_authenticator: 'plain'
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_auth_error: '535 Incorrect authentication data'
        - string: 'login authenticator failed for mail.example.com (helo) [198.51.100.9]:41234 I=[192.0.2.1]:25: 535 Incorrect authentication data (set_id=user@example.com)'
          numeric:
            - exim_local_port
            - exim_src_port
          result:
            exim_authenticator: 'login'
            exim_h_host: 'mail.example.com'
            exim_helo: 'helo'
            exim_src_ip: '198.51.100.9'
            exim_src_port: '41234'
            exim_local_ip: '192.0.2.1'
            exim_local_port: '25'
            exim_auth_error: '535 Incorrect authentication data'
            exim_auth_user: 'user@example.com'
        - string: 'TLS error on connection from (helo) [203.0.113.7] (SSL_accept): sslv3 alert certificate unknown'
          result:
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_tls_stage: 'SSL_accept'
            exim_tls_error: 'sslv3 alert certificate unknown'
        - string: 'H=(helo) [203.0.113.7] rejected connection in "connect" ACL'
          program: 'exim'
          result:
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_acl: 'connect'
            exim_acl_action: 'rejected'
        - string: 'H=(localhost) [203.0.113.7] rejected HELO: syntactically invalid argument'
          result:
            exim_helo: 'localhost'
            exim_src_ip: '203.0.113.7'
            exim_reject_verb: 'HELO'
            exim_reject_reason: 'syntactically invalid argument'
        - string: 'SMTP call from (helo) [203.0.113.7] dropped: too many nonmail commands'
          result:
            exim_smtp_phase: 'call'
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_smtp_event: 'dropped: too many nonmail commands'
        - string: 'SMTP connection from [198.51.100.9] lost'
          result:
            exim_smtp_phase: 'connection'
            exim_src_ip: '198.51.100.9'
            exim_smtp_event: 'lost'
        - string: 'SMTP command timeout on connection from (helo) [203.0.113.7]'
          result:
            exim_smtp_timeout_on: 'connection'
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
        # -- log_selector extras: +pid, +incoming_interface, +connection_id --
        - string: '[8003] dovecot_login authenticator failed for (helo) [203.0.113.7]:21298 I=[192.0.2.1]:465 Ci=8003: 535 Incorrect authentication data (set_id=neti@example.com)'
          numeric:
            - exim_conn_id
            - exim_local_port
            - exim_pid
            - exim_src_port
          result:
            exim_pid: '8003'
            exim_authenticator: 'dovecot_login'
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_src_port: '21298'
            exim_local_ip: '192.0.2.1'
            exim_local_port: '465'
            exim_conn_id: '8003'
            exim_auth_error: '535 Incorrect authentication data'
            exim_auth_user: 'neti@example.com'
        - string: 'H=mail.example.com [203.0.113.7]:43030 I=[192.0.2.1]:25 Ci=7326 CV=no SNI=mail.example.org F=<a@example.com> rejected RCPT <b@example.org>: relay not permitted'
          result:
            exim_h_host: 'mail.example.com'
            exim_src_ip: '203.0.113.7'
            exim_src_port: '43030'
            exim_local_ip: '192.0.2.1'
            exim_local_port: '25'
            exim_conn_id: '7326'
            exim_tls_cert_verified: 'no'
            exim_tls_sni: 'mail.example.org'
            exim_sender: 'a@example.com'
            exim_reject_verb: 'RCPT'
            exim_recipient: 'b@example.org'
            exim_reject_reason: 'relay not permitted'
        # older exim: sender and recipient without angle brackets
        - string: 'H=(helo) [203.0.113.7] F=a@example.com rejected RCPT b@example.org: relay not permitted'
          result:
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_sender: 'a@example.com'
            exim_reject_verb: 'RCPT'
            exim_recipient: 'b@example.org'
            exim_reject_reason: 'relay not permitted'
        - string: '1rABCD-0001Ab-2x H=mail.example.com [203.0.113.7] F=<a@example.com> rejected after DATA: This message contains a virus'
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_h_host: 'mail.example.com'
            exim_src_ip: '203.0.113.7'
            exim_sender: 'a@example.com'
            exim_reject_verb: 'DATA'
            exim_reject_reason: 'This message contains a virus'
        - string: 'H=[203.0.113.7]:62839 dropped by ''connect'' ACL: Country is banned'
          result:
            exim_src_ip: '203.0.113.7'
            exim_src_port: '62839'
            exim_acl_action: 'dropped'
            exim_acl: 'connect'
            exim_reject_reason: 'Country is banned'
        - string: '1rABCD-0001Ab-2x SMTP connection from (helo) [203.0.113.7]:44884 I=[192.0.2.1]:25 closed by DROP in ACL'
          result:
            exim_msgid: '1rABCD-0001Ab-2x'
            exim_smtp_phase: 'connection'
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_src_port: '44884'
            exim_local_ip: '192.0.2.1'
            exim_local_port: '25'
            exim_smtp_event: 'closed by DROP in ACL'
        # -- shapes with no message id --
        - string: 'no MAIL in SMTP connection from (helo) [203.0.113.7]:20042 I=[192.0.2.1]:25 D=0.349s C=EHLO,AUTH,QUIT'
          result:
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_src_port: '20042'
            exim_local_ip: '192.0.2.1'
            exim_local_port: '25'
            exim_duration: '0.349s'
            exim_smtp_commands: 'EHLO,AUTH,QUIT'
        - string: 'SMTP protocol error in "AUTH LOGIN" H=(helo) [203.0.113.7] AUTH command used when not advertised'
          result:
            exim_smtp_command: 'AUTH LOGIN'
            exim_helo: 'helo'
            exim_src_ip: '203.0.113.7'
            exim_smtp_error: 'AUTH command used when not advertised'
        # a client-supplied fake peer inside the command must not win
        - string: 'SMTP protocol error in "aUtH lOgIn" H=(test) [198.51.100.9]" H=(helo) [203.0.113.7] AUTH command used when not advertised'
          result:
            exim_smtp_command: 'aUtH lOgIn" H=(test) [198.51.100.9]'
            exim_helo: 'helo'
