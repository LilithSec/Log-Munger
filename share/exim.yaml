      - string: ' I=[192.0.2.1]:25 Ci=8003'
        result: ' I=[192.0.2.1]:25 Ci=8003'
      - string: ' I=[192.0.2.1]:25 Ci=7326 CV=no SNI=mail.example.com'
        result: ' I=[192.0.2.1]:25 Ci=7326 CV=no SNI=mail.example.com'
      - string: ' X=TLS1.3:TLS_AES_256_GCM_SHA384:256 CV=yes'
        result: ' X=TLS1.3:TLS_AES_256_GCM_SHA384:256 CV=yes'
