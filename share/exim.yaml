---
# Exim MTA (exim / exim4) main log enrichment.
#
# Gates on the syslog PROGRAM field being "exim" or "exim4". Patterns are
# anchored (each must match the whole MESSAGE) and first-match wins. Every
# capture is namespaced with exim_ .
#
# After Log::Munger strips the syslog timestamp + program, most Exim main-log
# lines begin with the internal message id (e.g. "1rABCD-0001Ab-2x") followed
# by a one/two character flag describing the event:
#   <=  arrival        =>  delivery        ->  additional recipient
#   >>  cutthrough     *>  delivery suppressed
#   **  delivery failed (bounce)           ==  deferred
#   Completed          (message fully processed)
# Some lines (e.g. connection-time RCPT rejections) have NO message id and are
# handled as separate patterns.
#
# What else is on a line depends on log_selector. +pid puts "[1234] " in front
# of everything, and +incoming_interface, +connection_id and the TLS items add
# I=, Ci=, X=, CV= and SNI= after the peer. EXIM_PID and EXIM_CONN_INFO take
# all of those as optional, so one set of patterns covers a stock config and a
# verbose one.
includes:
- base
vars_templated:
  # The "[1234] " log_selector +pid puts on the front of every line.
  EXIM_PID: '(?:\[(?<exim_pid>[% INT %])\] )?'
  # An exim message id, for the places it is optional and so cannot be a bare
  # NOTSPACE: the classic 6-6-2 form (1rABCD-0001Ab-2x) and the 4.97+ 6-11-4
  # form (1rABCD-0001Ab2xY3z-AbCd).
  EXIM_MSGID: '[0-9A-Za-z]{6}-[0-9A-Za-z]{6,11}-[0-9A-Za-z]{2,4}'
  # The connection details log_selector can add after the peer, in the order
  # exim writes them:
  #
  #   I=[192.0.2.1]:25 Ci=8003 X=TLS1.3:TLS_AES_256_GCM_SHA384:256 CV=no SNI=mail.example.com
  #
  # I= is the local address (+incoming_interface), Ci= the connection id
  # (+connection_id), X= the cipher, CV= whether the client certificate
  # verified, SNI= the name the client asked for (+tls_sni).
  EXIM_CONN_INFO: '(?: I=\[(?<exim_local_ip>[% IP %])\](?::(?<exim_local_port>[% INT %]))?)?(?: Ci=(?<exim_conn_id>[% INT %]))?(?: X=(?<exim_tls_cipher>[% NOTSPACE %]))?(?: CV=(?<exim_tls_cert_verified>[% WORD %]))?(?: SNI=(?<exim_tls_sni>[% NOTSPACE %]))?'
  # The way exim identifies a remote peer, shared by every pattern below that
  # has one. All three parts appear together as
  #
  #   H=mail.example.com (helo.they.claimed) [203.0.113.7]:25
  #
  # but exim drops whatever it does not have: no reverse DNS and the hostname
  # goes, a HELO matching the hostname and the parenthetical goes, and only
  # newer versions log the port at all. Only the bracketed address is always
  # there, so it is the only required part.
  #
  # The HELO is matched as "anything but a closing paren" rather than with the
  # base GREEDYDATA_NO_BRACKET, which excludes angle brackets instead and so
  # would run past the ")" it is supposed to stop at. A HELO is
  # attacker-controlled text and arrives with anything in it.
  EXIM_HOST_INFO: '(?:(?<exim_h_host>[% HOSTNAME %]) )?(?:\((?<exim_helo>[^)]*)\) )?\[(?<exim_src_ip>[% IP %])\](?::(?<exim_src_port>[% INT %]))?'
  # Arrival: "<msgid> <= sender@example.com H=mail.example.com [203.0.113.7]
  #  P=esmtp S=1234 id=<abc@x>". Sender may be "<>" for bounces (captured as
  #  the literal token). The H= host clause and later key=value fields are all
  #  optional so we tolerate the many arrival variants.
  EXIM_ARRIVAL: '[% EXIM_PID %](?<exim_msgid>[% NOTSPACE %]) (?<exim_flag><=) (?<exim_sender>[% NOTSPACE %])(?: H=[% EXIM_HOST_INFO %])?(?: P=(?<exim_proto>[% NOTSPACE %]))?(?: S=(?<exim_size>[% INT %]))?(?: id=(?<exim_id>[% NOTSPACE %]))?(?: [% GREEDYDATA %])?'
  # Delivery: "<msgid> => recipient@example.net R=dnslookup T=remote_smtp
  #  H=mx.example.net [198.51.100.2] X=TLS1.3 C=\"250 OK\"".
  # The H= here is the far end of an outbound connection rather than an
  # inbound peer, so it captures into exim_dst_ip and cannot share
  # EXIM_HOST_INFO.
  EXIM_DELIVERY: '[% EXIM_PID %](?<exim_msgid>[% NOTSPACE %]) (?<exim_flag>=>) (?<exim_recipient>[% NOTSPACE %])(?: R=(?<exim_router>[% NOTSPACE %]))?(?: T=(?<exim_transport>[% NOTSPACE %]))?(?: H=(?:(?<exim_h_host>[% HOSTNAME %]) )?\[(?<exim_dst_ip>[% IP %])\](?::(?<exim_dst_port>[% INT %]))?)?(?: [% GREEDYDATA %])?'
  # Additional recipient of an already-delivered message: "<msgid> ->
  #  extra@example.net R=... T=...".
  EXIM_ADDITIONAL: '[% EXIM_PID %](?<exim_msgid>[% NOTSPACE %]) (?<exim_flag>->) (?<exim_recipient>[% NOTSPACE %])(?: R=(?<exim_router>[% NOTSPACE %]))?(?: T=(?<exim_transport>[% NOTSPACE %]))?(?: H=(?:(?<exim_h_host>[% HOSTNAME %]) )?\[(?<exim_dst_ip>[% IP %])\](?::(?<exim_dst_port>[% INT %]))?)?(?: [% GREEDYDATA %])?'
  # Deferred: "<msgid> == recipient@example.net R=dnslookup T=remote_smtp defer
  #  (-53): retry time not reached". Everything after "defer ..." (or the first
  #  free-text) becomes the defer reason.
  EXIM_DEFERRED: '[% EXIM_PID %](?<exim_msgid>[% NOTSPACE %]) (?<exim_flag>==) (?<exim_recipient>[% NOTSPACE %])(?: R=(?<exim_router>[% NOTSPACE %]))?(?: T=(?<exim_transport>[% NOTSPACE %]))? (?<exim_defer_reason>[% GREEDYDATA %])'
  # Failed / bounce: "<msgid> ** recipient@example.net R=dnslookup
  #  T=remote_smtp: SMTP error from remote mail server after RCPT TO:<...>:
  #  550 No such user". The trailing free-text after the ": " is the error.
  EXIM_FAILED: '[% EXIM_PID %](?<exim_msgid>[% NOTSPACE %]) (?<exim_flag>\*\*) (?<exim_recipient>[% NOTSPACE %])(?: R=(?<exim_router>[% NOTSPACE %]))?(?: T=(?<exim_transport>[% NOTSPACE %]))?: (?<exim_error>[% GREEDYDATA %])'
  # Completed: "<msgid> Completed".
  EXIM_COMPLETED: '[% EXIM_PID %](?<exim_msgid>[% NOTSPACE %]) (?<exim_completed>Completed)(?: [% GREEDYDATA %])?'
  # Connection-time rejection (NO message id): "H=(helo) [203.0.113.7]
  #  F=<spammer@x> rejected RCPT <victim@example.com>: relay not permitted".
  #
  # Both the F=<sender> clause and the <address> after the verb are optional.
  # A rejection at MAIL time has no recipient yet, and one at HELO or from a
  # connect-time ACL has neither, so requiring them threw away the earliest
  # rejections -- exactly the ones that never cost the host any work and so are
  # the most interesting when counting who is being turned away.
  #
  # Older exim writes the sender and recipient without angle brackets
  # ("F=a@b rejected RCPT c@d: ..."), so both forms are taken. A rejection
  # after DATA has a message id in front and "after" before the verb:
  #   1rABCD-0001Ab-2x H=(helo) [203.0.113.7] F=<a@b> rejected after DATA: This message contains a virus
  EXIM_REJECT: '[% EXIM_PID %](?:(?<exim_msgid>[% EXIM_MSGID %]) )?H=[% EXIM_HOST_INFO %][% EXIM_CONN_INFO %](?: F=(?:<(?<exim_sender>[% GREEDYDATA_NO_BRACKET %])>|(?<exim_sender>[^\s<>]+)))? rejected (?:after )?(?<exim_reject_verb>[% WORD %])(?: (?:<(?<exim_recipient>[% GREEDYDATA_NO_BRACKET %])>|(?<exim_recipient>[^\s<>:]+)))?: (?<exim_reject_reason>[% GREEDYDATA %])'
  # ------------------------------------------------------------------
  # Authentication, TLS and connection handling.
  #
  # None of these carry a message id, because none of them got far enough for
  # exim to have accepted a message. They are where the credential stuffing,
  # the open-relay probing and the TLS misconfiguration live.
  # ------------------------------------------------------------------
  # "login authenticator failed for (helo) [203.0.113.7]: 535 Incorrect
  #  authentication data (set_id=admin)"
  #
  # The SMTP AUTH brute force, and the reason this file needs to look past the
  # message-id lines at all. set_id is the username that was tried, which
  # exim only appends once an authenticator got far enough to have one, so it
  # is optional.
  EXIM_AUTH_FAILED: '[% EXIM_PID %](?<exim_authenticator>[% NOTSPACE %]) authenticator failed for [% EXIM_HOST_INFO %][% EXIM_CONN_INFO %]: (?<exim_auth_error>.*?)(?: \(set_id=(?<exim_auth_user>[^)]*)\))?'
  # "H=(helo) [203.0.113.7] rejected connection in "connect" ACL"
  # "H=[203.0.113.7]:62839 dropped by 'connect' ACL: Country is banned"
  #
  # Refused before a single SMTP command was read, which is how a blocklist hit
  # or a rate limit appears. Kept separate from EXIM_REJECT because there is no
  # verb and no address here, only the ACL that said no. A deny says
  # "rejected", a drop (which also closes the connection) says "dropped", and
  # that word is kept as exim_acl_action.
  EXIM_REJECT_CONNECTION: '[% EXIM_PID %]H=[% EXIM_HOST_INFO %][% EXIM_CONN_INFO %] (?:(?<exim_acl_action>rejected) connection in|(?<exim_acl_action>dropped) by) ["''](?<exim_acl>[^"'']+)["''] ACL(?:[:.]? (?<exim_reject_reason>[% GREEDYDATA %]))?'
  # "TLS error on connection from (helo) [203.0.113.7] (SSL_accept):
  #  error:14094416:SSL routines:ssl3_read_bytes:sslv3 alert certificate unknown"
  #
  # The stage in parens is which TLS call failed, which is what separates a
  # client that hung up mid-handshake from one that could not agree on a
  # cipher or rejected the certificate.
  EXIM_TLS_ERROR: '[% EXIM_PID %]TLS error on connection from [% EXIM_HOST_INFO %](?: \((?<exim_tls_stage>[^)]*)\))?: (?<exim_tls_error>[% GREEDYDATA %])'
  # "SMTP call from (helo) [203.0.113.7] dropped: too many nonmail commands"
  # "SMTP connection from [203.0.113.7] lost"
  # "SMTP command timeout on connection from (helo) [203.0.113.7]"
  #
  # How a connection ended when it did not end in a message. "too many nonmail
  # commands" in particular is exim naming a client that sat there issuing RSET
  # or VRFY, which is address harvesting.
  #
  # A connection that had a message in progress when it ended gets that
  # message's id in front:
  #   1rABCD-0001Ab-2x SMTP connection from (helo) [203.0.113.7]:44884 I=[192.0.2.1]:25 closed by DROP in ACL
  EXIM_SMTP_CONNECTION: '[% EXIM_PID %](?:(?<exim_msgid>[% EXIM_MSGID %]) )?SMTP (?:(?<exim_smtp_phase>call|connection) from|command timeout on (?<exim_smtp_timeout_on>connection|TLS connection) from) [% EXIM_HOST_INFO %][% EXIM_CONN_INFO %](?:[ :]+(?<exim_smtp_event>[% GREEDYDATA %]))?'
  # "no MAIL in SMTP connection from (helo) [203.0.113.7]:20042 I=[192.0.2.1]:25 D=0.349s C=EHLO,AUTH,QUIT"
  #
  # A client that connected and left without trying to send anything. D= is
  # how long it stayed and C= (+smtp_no_mail) the commands it used, so a
  # session of EHLO,AUTH,QUIT is someone testing a password.
  EXIM_NO_MAIL: '[% EXIM_PID %]no MAIL in SMTP connection from [% EXIM_HOST_INFO %][% EXIM_CONN_INFO %](?: D=(?<exim_duration>[% NOTSPACE %]))?(?: C=(?<exim_smtp_commands>[% NOTSPACE %]))?'
  # "SMTP protocol error in "AUTH LOGIN" H=(helo) [203.0.113.7]:4816 I=[192.0.2.1]:25 AUTH command used when not advertised"
  #
  # The quoted command is whatever the client sent, so it can contain a quote
  # and a fake " H=(...) [address]" of its own. The command is therefore
  # greedy, which backtracks to the last " H=" and so to the peer exim wrote
  # rather than one the client made up.
  EXIM_SMTP_PROTOCOL_ERROR: '[% EXIM_PID %]SMTP protocol error in "(?<exim_smtp_command>.*)" H=[% EXIM_HOST_INFO %][% EXIM_CONN_INFO %] (?<exim_smtp_error>[% GREEDYDATA %])'
  # "SMTP protocol synchronization error (input sent without waiting for greeting): rejected connection from H=[203.0.113.7]:25936 I=[192.0.2.1]:25 input="GET / HTTP/1.1\r\n\r\n""
  # "SMTP protocol synchronization error (next input sent too soon: pipelining was not advertised): rejected "RSET" H=mail.example.com [203.0.113.7]:58302 I=[192.0.2.1]:25 next input="QUIT\r\n""
  #
  # A client that talks before it is spoken to. A web request or a spam tool
  # that does not wait for the banner, which a real MTA never does.
  EXIM_SMTP_SYNC_ERROR: '[% EXIM_PID %]SMTP protocol synchronization error \((?<exim_sync_error>[^)]*)\): rejected (?:connection from|"(?<exim_smtp_command>[^"]*)") H=[% EXIM_HOST_INFO %][% EXIM_CONN_INFO %](?: (?:next )?input="(?<exim_smtp_input>.*)")?'
  # "H=mail.example.com [203.0.113.7] sender verify fail for <a@example.com>: Unrouteable address"
  #
  # The callout or routing check on an address the client gave failed or was
  # deferred. The rejection that follows is logged separately by EXIM_REJECT.
  EXIM_VERIFY_FAIL: '[% EXIM_PID %]H=[% EXIM_HOST_INFO %][% EXIM_CONN_INFO %](?: F=<(?<exim_sender>[% GREEDYDATA_NO_BRACKET %])>)? (?<exim_verify_type>sender|recipient) verify (?<exim_verify_result>fail|defer) for <(?<exim_verify_address>[^>]*)>(?:: (?<exim_verify_error>[% GREEDYDATA %]))?'
  # "no host name found for IP address 203.0.113.7"
  #
  # The reverse lookup on a connecting client found nothing. The address is
  # the client's, so it goes into exim_src_ip like every other peer.
  EXIM_NO_HOST_NAME: '[% EXIM_PID %]no host name found for IP address (?<exim_src_ip>[% IP %])'
  # "no IP address found for host mail.example.com (during SMTP connection from [203.0.113.7]:49390 I=[192.0.2.1]:25)"
  #
  # The forward lookup of the name the reverse lookup returned came back
  # empty: the client's PTR record points at a name that does not resolve.
  EXIM_NO_IP_FOR_HOST: '[% EXIM_PID %]no IP address found for host (?<exim_lookup_host>[% NOTSPACE %]) \(during SMTP connection from [% EXIM_HOST_INFO %][% EXIM_CONN_INFO %]\)'
  # "1rABCD-0001Ab-2x F=<a@b> H=(helo) [203.0.113.7]:43671 I=[192.0.2.1]:25 P=esmtp rejected by local_scan(): Rejected"
  #
  # A message refused by a local_scan() module such as SA-Exim. Unlike the ACL
  # rejections it has a message id, and the sender comes before the host.
  EXIM_LOCAL_SCAN_REJECT: '[% EXIM_PID %](?<exim_msgid>[% EXIM_MSGID %]) F=<?(?<exim_sender>[^\s<>]*)>? H=[% EXIM_HOST_INFO %][% EXIM_CONN_INFO %](?: P=(?<exim_proto>[% NOTSPACE %]))? rejected by local_scan\(\): (?<exim_reject_reason>[% GREEDYDATA %])'
  # SA-Exim's verdict on a scanned message:
  #   1rABCD-0001Ab-2x SA: Action: silently tossed message: score=31.0 required=5.0 trigger=30.0 (scanned in 6/6 secs | Message-Id: abc@example.com). From <a@b> (host=mail.example.com [203.0.113.7]) for c@d
  #
  # trigger= is the score above which SA-Exim discards rather than rejects,
  # and is only logged when that threshold applies. A client with no reverse
  # name is logged as host=NULL.
  EXIM_SA_ACTION: '[% EXIM_PID %](?<exim_msgid>[% EXIM_MSGID %]) SA: Action: (?<exim_sa_action>[^:]+): score=(?<exim_sa_score>-?[0-9.]+) required=(?<exim_sa_required>-?[0-9.]+)(?: trigger=(?<exim_sa_trigger>-?[0-9.]+))? \(scanned in (?<exim_sa_scan_time>[% NOTSPACE %]) secs \| Message-Id: (?<exim_sa_message_id>[^)]*)\)\. From <(?<exim_sender>[^>]*)> \(host=(?<exim_h_host>[% NOTSPACE %]) \[(?<exim_src_ip>[% IP %])\]\) for (?<exim_recipient>[% GREEDYDATA %])'
vars_tests:
  EXIM_ARRIVAL:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x <= sender@example.com H=mail.example.com [203.0.113.7] P=esmtp S=1234 id=<abc@x>'
        result: '1rABCD-0001Ab-2x <= sender@example.com H=mail.example.com [203.0.113.7] P=esmtp S=1234 id=<abc@x>'
      - string: '1rWXYZ-0002Cd-9y <= bounce@example.org H=relay.example.org [198.51.100.5] P=esmtps S=987'
        result: '1rWXYZ-0002Cd-9y <= bounce@example.org H=relay.example.org [198.51.100.5] P=esmtps S=987'
    negative:
      - '1rABCD-0001Ab-2x => recipient@example.net R=dnslookup T=remote_smtp'
  EXIM_DELIVERY:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x => recipient@example.net R=dnslookup T=remote_smtp H=mx.example.net [198.51.100.2] X=TLS1.3 C="250 OK"'
        result: '1rABCD-0001Ab-2x => recipient@example.net R=dnslookup T=remote_smtp H=mx.example.net [198.51.100.2] X=TLS1.3 C="250 OK"'
      - string: '1rABCD-0001Ab-2x => localuser R=localuser T=local_delivery'
        result: '1rABCD-0001Ab-2x => localuser R=localuser T=local_delivery'
    negative:
      - '1rABCD-0001Ab-2x <= sender@example.com H=mail.example.com [203.0.113.7] P=esmtp S=1234'
  EXIM_ADDITIONAL:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x -> extra@example.net R=dnslookup T=remote_smtp H=mx.example.net [198.51.100.2]'
        result: '1rABCD-0001Ab-2x -> extra@example.net R=dnslookup T=remote_smtp H=mx.example.net [198.51.100.2]'
      - string: '1rABCD-0001Ab-2x -> second@example.net R=dnslookup T=remote_smtp'
        result: '1rABCD-0001Ab-2x -> second@example.net R=dnslookup T=remote_smtp'
    negative:
      - '1rABCD-0001Ab-2x => recipient@example.net R=dnslookup T=remote_smtp'
  EXIM_DEFERRED:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x == recipient@example.net R=dnslookup T=remote_smtp defer (-53): retry time not reached'
        result: '1rABCD-0001Ab-2x == recipient@example.net R=dnslookup T=remote_smtp defer (-53): retry time not reached'
      - string: '1rABCD-0001Ab-2x == user@example.org R=dnslookup T=remote_smtp defer (110, 0): Connection timed out'
        result: '1rABCD-0001Ab-2x == user@example.org R=dnslookup T=remote_smtp defer (110, 0): Connection timed out'
    negative:
      - '1rABCD-0001Ab-2x ** recipient@example.net R=dnslookup T=remote_smtp: 550 No such user'
  EXIM_FAILED:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x ** recipient@example.net R=dnslookup T=remote_smtp: SMTP error from remote mail server after RCPT TO:<recipient@example.net>: 550 No such user'
        result: '1rABCD-0001Ab-2x ** recipient@example.net R=dnslookup T=remote_smtp: SMTP error from remote mail server after RCPT TO:<recipient@example.net>: 550 No such user'
      - string: '1rABCD-0001Ab-2x ** baduser@example.org R=dnslookup T=remote_smtp: retry timeout exceeded'
        result: '1rABCD-0001Ab-2x ** baduser@example.org R=dnslookup T=remote_smtp: retry timeout exceeded'
    negative:
      - '1rABCD-0001Ab-2x == recipient@example.net R=dnslookup T=remote_smtp defer (-53): retry time not reached'
  EXIM_COMPLETED:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '1rABCD-0001Ab-2x Completed'
        result: '1rABCD-0001Ab-2x Completed'
      - string: '1rWXYZ-0002Cd-9y Completed'
        result: '1rWXYZ-0002Cd-9y Completed'
    negative:
      - '1rABCD-0001Ab-2x => recipient@example.net R=dnslookup T=remote_smtp'
  EXIM_REJECT:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'H=(helo) [203.0.113.7] F=<spammer@x> rejected RCPT <victim@example.com>: relay not permitted'
        result: 'H=(helo) [203.0.113.7] F=<spammer@x> rejected RCPT <victim@example.com>: relay not permitted'
      - string: 'H=(evil.example) [198.51.100.9] F=<bad@evil.example> rejected RCPT <target@example.org>: sender verify failed'
        result: 'H=(evil.example) [198.51.100.9] F=<bad@evil.example> rejected RCPT <target@example.org>: sender verify failed'
      # Rejected at MAIL time, so there is no recipient yet
      - string: 'H=(evil.example) [198.51.100.9] F=<bad@evil.example> rejected MAIL: sender blocked'
        result: 'H=(evil.example) [198.51.100.9] F=<bad@evil.example> rejected MAIL: sender blocked'
      # Rejected at HELO time, so there is no sender either
      - string: 'H=(localhost) [203.0.113.7] rejected HELO: syntactically invalid argument'
        result: 'H=(localhost) [203.0.113.7] rejected HELO: syntactically invalid argument'
      # The full host clause: reverse name, claimed HELO, address and port
      - string: 'H=mail.example.com (helo.example) [203.0.113.7]:41234 F=<a@b> rejected RCPT <c@d>: relay not permitted'
        result: 'H=mail.example.com (helo.example) [203.0.113.7]:41234 F=<a@b> rejected RCPT <c@d>: relay not permitted'
      - string: '[10099] H=(helo) [203.0.113.7]:3755 I=[192.0.2.1]:25 F=a@example.com rejected RCPT b@example.org: relay not permitted'
        result: '[10099] H=(helo) [203.0.113.7]:3755 I=[192.0.2.1]:25 F=a@example.com rejected RCPT b@example.org: relay not permitted'
      - string: '1rABCD-0001Ab-2x H=mail.example.com [203.0.113.7]:32706 I=[192.0.2.1]:25 F=<a@example.com> rejected after DATA: This message contains a virus'
        result: '1rABCD-0001Ab-2x H=mail.example.com [203.0.113.7]:32706 I=[192.0.2.1]:25 F=<a@example.com> rejected after DATA: This message contains a virus'
      - string: 'H=mail.example.com [203.0.113.7]:43030 I=[192.0.2.1]:25 Ci=7326 CV=no SNI=mail.example.org F=<a@example.com> rejected RCPT <b@example.org>: relay not permitted'
        result: 'H=mail.example.com [203.0.113.7]:43030 I=[192.0.2.1]:25 Ci=7326 CV=no SNI=mail.example.org F=<a@example.com> rejected RCPT <b@example.org>: relay not permitted'
    negative:
      - '1rABCD-0001Ab-2x Completed'
      # No verb and no address: that is EXIM_REJECT_CONNECTION
      - 'H=(helo) [203.0.113.7] rejected connection in "connect" ACL'
  EXIM_HOST_INFO:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'mail.example.com (helo.example) [203.0.113.7]:41234'
        result: 'mail.example.com (helo.example) [203.0.113.7]:41234'
      - string: '(helo.example) [203.0.113.7]'
        result: '(helo.example) [203.0.113.7]'
      - string: '[203.0.113.7]'
        result: '[203.0.113.7]'
      - string: 'mail.example.com [203.0.113.7]'
        result: 'mail.example.com [203.0.113.7]'
    negative:
      # The bracketed address is the one part that is never absent.
      - 'mail.example.com (helo.example)'
      - '203.0.113.7'
  EXIM_AUTH_FAILED:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'login authenticator failed for (helo) [203.0.113.7]: 535 Incorrect authentication data (set_id=admin)'
        result: 'login authenticator failed for (helo) [203.0.113.7]: 535 Incorrect authentication data (set_id=admin)'
      # no set_id: the authenticator failed before it had a username
      - string: 'plain authenticator failed for (helo) [203.0.113.7]: 535 Incorrect authentication data'
        result: 'plain authenticator failed for (helo) [203.0.113.7]: 535 Incorrect authentication data'
      - string: 'login authenticator failed for mail.example.com (helo) [198.51.100.9]:41234 I=[192.0.2.1]:25: 535 Incorrect authentication data (set_id=user@example.com)'
        result: 'login authenticator failed for mail.example.com (helo) [198.51.100.9]:41234 I=[192.0.2.1]:25: 535 Incorrect authentication data (set_id=user@example.com)'
    negative:
      - 'H=(helo) [203.0.113.7] F=<a@b> rejected RCPT <c@d>: relay not permitted'
  EXIM_REJECT_CONNECTION:
