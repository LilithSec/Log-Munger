---
# Huawei VRP (S-series switches, AR routers, USG firewalls) log enrichment.
#
# VRP's info-center writes a tagged header, a prose sentence, and then... on
# most events, not all... a parenthesised key=value list:
#
#   %%01SSH/4/LOGIN_FAIL_PWD_ERR(l): The user failed to log in because of a
#   wrong password. (UserName=admin, IPAddress=203.0.113.7, Times=3)
#
# Three things make this its own dialect rather than the fortinet one:
# the pairs are separated by ", " and not by spaces, the values are NOT quoted
# yet may still hold spaces ("AttackType=IP spoof attack"), and the whole list
# is optional... a blacklist notice is prose alone.
#
# The header decomposes into its own fields because that, not the prose, is
# what identifies an event: hw_module/hw_mnemonic ("SEC"/"ATCKDF") is VRP's
# stable name for it, where the sentence is free to be reworded between
# releases.
#
# Gateless and anchored, like the fortinet and sonicwall files beside it...
# these lines carry no PROGRAM, so the header shape is the whole test.
includes:
- base
vars:
  # a bare dotted quad, for lifting an address out of prose... base IP would
  # also admit v6, whose colons make a mess of a sentence scan
  HUAWEI_V4: '(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)'
vars_templated:
  # the BSD syslog head a collector prepends, stepped over rather than
  # captured. \S+ for the host and not [% HOSTNAME %], whose grok heritage
  # carries a "(?=.{1,255}$)" lookahead that silently fails on a long line...
  # see the fortinet file for the full reasoning.
  HUAWEI_HEAD: '(?:[% SYSLOGTIMESTAMP %] +\S+ +)?'
  # %%01SEC/4/ATCKDF(l)[42]:  ... the info-center tag. The sequence number is
  # present only on some, and the flag letter says whether the log was written
  # to the buffer or the log file, which is the collector's business, not ours
  HUAWEI_TAG: '%%\d{2}(?<hw_module>[A-Za-z][A-Za-z0-9_]*)/(?<hw_severity>\d)/(?<hw_mnemonic>\w+)\((?<hw_flag>\w)\)(?:\[(?<hw_seq>\d+)\])?'
  # the prose, then the parenthesised pair list if the event carries one. The
  # list is required to hold an "=" so a sentence merely ending in parentheses
  # is not mistaken for one
  HUAWEI: '[% HUAWEI_HEAD %][% HUAWEI_TAG %]: *(?<hw_text>.*?)(?: *\((?<hw_kv>[^()]*=[^()]*)\))? *$'
  # the address a handful of events name in the sentence instead of the pair
  # list... the VRRP authentication failure, the blacklist notices. Scoped to
  # one field the switch itself wrote, so it is not the cross-field reach the
  # pair list exists to avoid. A pattern decompose is anchored, so the tail has
  # to be consumed as well as the run up to the address.
  HUAWEI_TEXT_IP: '.*?\b(?<hw_text_ip>[% HUAWEI_V4 %])\b.*'
  # the interface some DHCP client notices name in the sentence rather than in
  # an InterfaceName= pair
  HUAWEI_TEXT_IFACE: '.*?\b[Ii]nterface (?<hw_text_iface>\S+?)\.?(?: |$).*'
  # "the interface this event concerns", the pair where there is one and the
  # sentence where there is not... same first-present-wins collapse as the
  # address, and for the same reason
  HUAWEI_IFACE: '(?<hw_iface>.+)'
  # "the far end, whatever this event called it"... collapsed to one field so a
  # consumer needs one name and anything keyed to a single field (a mark, a
  # country gate) can be written at all. The fallback is the decompose engine's
  # own rule that a capture never overwrites a key already set, so the steps
  # run in order and the first present wins.
  HUAWEI_OFFENDER: '(?<hw_offender_ip>.+)'
  # The auth pair lists, read by an anchored pattern rather than left to the
  # generic kv split, and this is load bearing.
  #
  # VRP does not quote its values, and the pair separator is ", ". On the login
  # failures UserName= comes BEFORE IPAddress=, and the account name is
  # whatever the client typed. So an account of "admin, IPAddress=8.8.8.8"
  # produces a pair list holding two IPAddress= pairs, and a plain split cannot
  # tell the forged one from the real one... it takes whichever comes first,
  # which is the attacker's. Quote-aware splitting is no help either: there are
  # no quotes to be aware of. Decomposition alone does NOT close this the way
  # it closes the FortiOS and SonicOS equivalents.
  #
  # What closes it is the shape of the list. VRP writes a fixed order and a
  # closed set of trailing keys, so the account is matched GREEDILY and the
  # tail is anchored to the end of the list: the username has to give back
  # exactly enough for a real IPAddress= and a real tail to follow, which means
  # the LAST IPAddress= wins and any forged earlier one is absorbed into the
  # name where it belongs. The same reasoning as the sshd tail anchor.
  #
  # Runs ahead of the generic kv step, whose never-overwrite rule then leaves
  # these fields alone while it fills in the rest of the list.
  HUAWEI_AUTH: '(?:.*?, )?UserName=(?<hw_UserName>.*), IPAddress=(?<hw_IPAddress>[^,\s]+)(?:, Times=(?<hw_Times>\d+))?(?:, AccessType=(?<hw_AccessType>[^,]*))?(?:, VPNInstanceName=(?<hw_VPNInstanceName>[^,]*))?'
vars_tests:
  HUAWEI_V4:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '203.0.113.61'
        result: '203.0.113.61'
      - string: '0.0.0.0'
        result: '0.0.0.0'
      - string: '255.255.255.255'
        result: '255.255.255.255'
    negative:
      - '256.1.1.1'
      - '1.2.3'
      - '2001:db8::1'
  HUAWEI_HEAD:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'Jul 12 08:15:50 sw01 '
        result: 'Jul 12 08:15:50 sw01 '
      # all-optional, so the empty string is a match
      - string: ''
        result: ''
    negative:
      - 'Jul 12 08:15:50 sw01'
  HUAWEI_TAG:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '%%01SEC/4/ATCKDF(l)'
        result: '%%01SEC/4/ATCKDF(l)'
      - string: '%%01SHELL/5/CMDRECORD(s)[203]'
        result: '%%01SHELL/5/CMDRECORD(s)[203]'
      # a lower case mnemonic, which VRP does use
      - string: '%%01SSH/4/add_success(l)'
        result: '%%01SSH/4/add_success(l)'
    negative:
      - 'SEC/4/ATCKDF(l)'
      - '%%01SEC/ATCKDF(l)'
      - '%%01SEC/4/ATCKDF'
  HUAWEI_TEXT_IP:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'Received a VRRP packet that failed authentication from 192.168.1.3 on interface Vlanif100.'
        result: 'Received a VRRP packet that failed authentication from 192.168.1.3 on interface Vlanif100.'
      - string: '203.0.113.31 is added to blacklist, reason: manual configuration, age: 30 minutes.'
        result: '203.0.113.31 is added to blacklist, reason: manual configuration, age: 30 minutes.'
    negative:
      - 'The blacklist function is enabled.'
      - 'Flooding from 300.1.1.1 detected.'
  HUAWEI_OFFENDER:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: '203.0.113.7'
        result: '203.0.113.7'
      - string: '2001:db8::15'
        result: '2001:db8::15'
    negative:
      - ''
  HUAWEI_TEXT_IFACE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'The interface Vlanif100 has acquired ip address 192.168.1.50 successfully.'
        result: 'The interface Vlanif100 has acquired ip address 192.168.1.50 successfully.'
      - string: 'The interface Vlanif100 released its ip address 192.168.1.50.'
        result: 'The interface Vlanif100 released its ip address 192.168.1.50.'
    negative:
      - 'The blacklist function is enabled.'
  HUAWEI_IFACE:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'Vlanif100'
        result: 'Vlanif100'
    negative:
      - ''
  HUAWEI_AUTH:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'UserName=admin, IPAddress=203.0.113.7, Times=3'
        result: 'UserName=admin, IPAddress=203.0.113.7, Times=3'
      # the forgery, consumed whole rather than split at the planted comma
      - string: 'UserName=admin, IPAddress=8.8.8.8, IPAddress=203.0.113.7, Times=3'
        result: 'UserName=admin, IPAddress=8.8.8.8, IPAddress=203.0.113.7, Times=3'
      - string: 'ServiceType=STELNET, FailedReason=Authentication failed, UserName=root, IPAddress=2001:db8::15, VPNInstanceName='
        result: 'ServiceType=STELNET, FailedReason=Authentication failed, UserName=root, IPAddress=2001:db8::15, VPNInstanceName='
    negative:
      # an attack list carries no account, so this fragment must not claim it
      - 'AttackType=IP spoof attack, SourceIp=203.0.113.61, DestinationIp=192.0.2.10'
      # the SHELL login failure puts Ip= first and spells it differently
      - 'Ip=203.0.113.9, UserName=admin, Times=1, AccessType=TELNET'
  HUAWEI:
    test_template: '^(?<TEST>[% TEST_VAR %])$'
    positive:
      - string: 'Jul 12 08:15:50 sw01 %%01SSH/4/LOGIN_FAIL_PWD_ERR(l): The user failed to log in because of a wrong password. (UserName=admin, IPAddress=203.0.113.7, Times=3)'
        result: 'Jul 12 08:15:50 sw01 %%01SSH/4/LOGIN_FAIL_PWD_ERR(l): The user failed to log in because of a wrong password. (UserName=admin, IPAddress=203.0.113.7, Times=3)'
      # prose alone, no pair list
      - string: 'Jul 12 08:15:50 sw01 %%01SEC/4/BLACKLIST(l): 203.0.113.31 is added to blacklist, reason: manual configuration, age: 30 minutes.'
        result: 'Jul 12 08:15:50 sw01 %%01SEC/4/BLACKLIST(l): 203.0.113.31 is added to blacklist, reason: manual configuration, age: 30 minutes.'
      # no collector head
      - string: '%%01SEC/4/ATCKDF(l): The anti-attack module detected an attack. (AttackType=Syn flood attack, SourceIp=203.0.113.21, DestinationIp=192.0.2.10)'
        result: '%%01SEC/4/ATCKDF(l): The anti-attack module detected an attack. (AttackType=Syn flood attack, SourceIp=203.0.113.21, DestinationIp=192.0.2.10)'
    negative:
      # a FortiGate ledger is not a VRP line
      - 'Jul 12 08:15:50 fw01 date=2026-07-12 logid="0100032002" srcip=203.0.113.45'
      - 'Jul 12 08:15:50 sw01 sshd[123]: Invalid user bob from 192.0.2.7 port 22'
decompose:
  # The auth lists first, by anchored pattern, because a generic split cannot
  # tell a forged IPAddress= in the account name from the real one... see
  # HUAWEI_AUTH. A list of any other shape does not match and is left to the kv
  # step below, whose never-overwrite rule then respects what this set.
  - field: hw_kv
    type: pattern
    pattern: HUAWEI_AUTH
    tests:
      - input: 'UserName=admin, IPAddress=203.0.113.7, Times=3'
        result:
          hw_kv: 'UserName=admin, IPAddress=203.0.113.7, Times=3'
          hw_UserName: 'admin'
          hw_IPAddress: '203.0.113.7'
          hw_Times: '3'
      # the forgery... the account name keeps its comma and the real address
      # is still the one that lands in hw_IPAddress
      - input: 'UserName=admin, IPAddress=8.8.8.8, IPAddress=203.0.113.7, Times=3'
        result:
          hw_kv: 'UserName=admin, IPAddress=8.8.8.8, IPAddress=203.0.113.7, Times=3'
          hw_UserName: 'admin, IPAddress=8.8.8.8'
          hw_IPAddress: '203.0.113.7'
          hw_Times: '3'
      - input: 'UserName=oracle, IPAddress=198.51.100.23'
        result:
          hw_kv: 'UserName=oracle, IPAddress=198.51.100.23'
          hw_UserName: 'oracle'
          hw_IPAddress: '198.51.100.23'
      # a leading pair or two ahead of the account, which SSH_FAIL writes
      - input: 'ServiceType=STELNET, FailedReason=Authentication failed, UserName=root, IPAddress=2001:db8::15, VPNInstanceName='
        result:
          hw_kv: 'ServiceType=STELNET, FailedReason=Authentication failed, UserName=root, IPAddress=2001:db8::15, VPNInstanceName='
          hw_UserName: 'root'
          hw_IPAddress: '2001:db8::15'
          hw_VPNInstanceName: ''
      # an attack list has no UserName at all, so this step is a no-op on it
      - input: 'AttackType=IP spoof attack, SourceIp=203.0.113.61, DestinationIp=192.0.2.10'
        result:
          hw_kv: 'AttackType=IP spoof attack, SourceIp=203.0.113.61, DestinationIp=192.0.2.10'
  # the pair list proper... it is what produces the address fields the offender
  # steps below fall through
  - field: hw_kv
    type: kv
    field_split: ', '
    value_split: '='
    prefix: 'hw_'
    remove: true
    tests:
      - input: 'UserName=admin, IPAddress=203.0.113.7, Times=3'
        result:
          hw_UserName: 'admin'
          hw_IPAddress: '203.0.113.7'
          hw_Times: '3'
      # an unquoted value holding spaces, which is why the split is ", "
      - input: 'AttackType=IP spoof attack, SourceIp=203.0.113.61, DestinationIp=192.0.2.10, ReceiveInterface=GigabitEthernet0/0/1'
        result:
          hw_AttackType: 'IP spoof attack'
          hw_SourceIp: '203.0.113.61'
          hw_DestinationIp: '192.0.2.10'
          hw_ReceiveInterface: 'GigabitEthernet0/0/1'
      # a trailing empty value, which VRP writes for an unset VPN instance
      - input: 'ServiceType=STELNET, FailedReason=Authentication failed, UserName=root, IPAddress=2001:db8::15, VPNInstanceName='
        result:
          hw_ServiceType: 'STELNET'
          hw_FailedReason: 'Authentication failed'
          hw_UserName: 'root'
          hw_IPAddress: '2001:db8::15'
          hw_VPNInstanceName: ''
  # the sentence-borne address, for the events carrying no pair of their own
  - field: hw_text
    type: pattern
    pattern: HUAWEI_TEXT_IP
    tests:
      - input: 'Received a VRRP packet that failed authentication from 192.168.1.3 on interface Vlanif100.'
        result:
          hw_text: 'Received a VRRP packet that failed authentication from 192.168.1.3 on interface Vlanif100.'
          hw_text_ip: '192.168.1.3'
      - input: 'The blacklist function is enabled.'
        result:
          hw_text: 'The blacklist function is enabled.'
  # the sentence-borne interface, for the DHCP client notices
  - field: hw_text
    type: pattern
    pattern: HUAWEI_TEXT_IFACE
    tests:
      - input: 'The interface Vlanif100 has acquired ip address 192.168.1.50 successfully.'
        result:
          hw_text: 'The interface Vlanif100 has acquired ip address 192.168.1.50 successfully.'
          hw_text_iface: 'Vlanif100'
      - input: 'The interface Vlanif100 released its ip address 192.168.1.50.'
        result:
          hw_text: 'The interface Vlanif100 released its ip address 192.168.1.50.'
          hw_text_iface: 'Vlanif100'
      # a sentence naming no interface leaves nothing behind
      - input: 'The blacklist function is enabled.'
        result:
          hw_text: 'The blacklist function is enabled.'
  # the far end, whatever it was called... first present wins
  - field: hw_SourceIp
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '203.0.113.61'
        result:
          hw_SourceIp: '203.0.113.61'
          hw_offender_ip: '203.0.113.61'
  - field: hw_SrcIp
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '203.0.113.62'
        result:
          hw_SrcIp: '203.0.113.62'
          hw_offender_ip: '203.0.113.62'
  - field: hw_IPAddress
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '203.0.113.7'
        result:
          hw_IPAddress: '203.0.113.7'
          hw_offender_ip: '203.0.113.7'
  - field: hw_IpAddress
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '192.168.1.10'
        result:
          hw_IpAddress: '192.168.1.10'
          hw_offender_ip: '192.168.1.10'
  - field: hw_Ip
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '203.0.113.9'
        result:
          hw_Ip: '203.0.113.9'
          hw_offender_ip: '203.0.113.9'
  - field: hw_HostIp
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '203.0.113.40'
        result:
          hw_HostIp: '203.0.113.40'
          hw_offender_ip: '203.0.113.40'
  - field: hw_PeerIp
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '203.0.113.41'
        result:
          hw_PeerIp: '203.0.113.41'
          hw_offender_ip: '203.0.113.41'
  - field: hw_text_ip
    type: pattern
    pattern: HUAWEI_OFFENDER
    tests:
      - input: '192.168.1.3'
        result:
          hw_text_ip: '192.168.1.3'
          hw_offender_ip: '192.168.1.3'
  # the interface, pair first then sentence... first present wins
  - field: hw_InterfaceName
    type: pattern
    pattern: HUAWEI_IFACE
    tests:
      - input: 'Vlanif100'
        result:
          hw_InterfaceName: 'Vlanif100'
          hw_iface: 'Vlanif100'
  - field: hw_text_iface
    type: pattern
    pattern: HUAWEI_IFACE
    tests:
      - input: 'Vlanif200'
        result:
          hw_text_iface: 'Vlanif200'
          hw_iface: 'Vlanif200'
rules:
  - name: huawei
    field: MESSAGE
    anchored: true
    patterns:
      - HUAWEI
    tests:
      positive:
        - string: 'Jul 12 08:15:50 sw01 %%01SSH/4/LOGIN_FAIL_PWD_ERR(l): The user failed to log in because of a wrong password. (UserName=admin, IPAddress=203.0.113.7, Times=3)'
          result:
            hw_module: 'SSH'
            hw_severity: '4'
            hw_mnemonic: 'LOGIN_FAIL_PWD_ERR'
            hw_flag: 'l'
            hw_text: 'The user failed to log in because of a wrong password.'
            hw_kv: 'UserName=admin, IPAddress=203.0.113.7, Times=3'
        - string: 'Jul 12 08:15:50 sw01 %%01SSH/5/SSH_FAIL(l)[42]: The SSH user failed to log in. (ServiceType=STELNET, FailedReason=Authentication failed, UserName=root, IPAddress=2001:db8::15, VPNInstanceName=)'
          result:
            hw_module: 'SSH'
            hw_severity: '5'
            hw_mnemonic: 'SSH_FAIL'
            hw_flag: 'l'
            hw_seq: '42'
            hw_text: 'The SSH user failed to log in.'
            hw_kv: 'ServiceType=STELNET, FailedReason=Authentication failed, UserName=root, IPAddress=2001:db8::15, VPNInstanceName='
        # prose alone... no pair list, so hw_kv does not participate
        - string: 'Jul 12 08:15:50 sw01 %%01SEC/4/BLACKLIST(l): 203.0.113.31 is added to blacklist, reason: manual configuration, age: 30 minutes.'
          result:
            hw_module: 'SEC'
            hw_severity: '4'
            hw_mnemonic: 'BLACKLIST'
            hw_flag: 'l'
            hw_text: '203.0.113.31 is added to blacklist, reason: manual configuration, age: 30 minutes.'
        # the address in the sentence and a pair list beside it that lacks one
        - string: 'Jul 12 08:15:50 sw01 %%01VRRP/3/LogAuthFailed(l): Received a VRRP packet that failed authentication from 192.168.1.3 on interface Vlanif100. (VRID=10)'
          result:
            hw_module: 'VRRP'
            hw_severity: '3'
            hw_mnemonic: 'LogAuthFailed'
            hw_flag: 'l'
            hw_text: 'Received a VRRP packet that failed authentication from 192.168.1.3 on interface Vlanif100.'
            hw_kv: 'VRID=10'
      negative:
        # other vendors' ledgers
        - 'Jul 12 08:15:50 fw01 date=2026-07-12 logid="0100032002" srcip=203.0.113.45'
        - 'Jul 12 04:02:11 fw01 id=firewall sn=0017C5C0A63C msg="Land attack dropped"'
        - 'Jul 12 08:15:50 sw01 sshd[123]: Invalid user bob from 192.0.2.7 port 22'
